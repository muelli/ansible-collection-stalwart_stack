---
# Order matters: Caddy has to obtain the certificates before the Stalwart
# plan references them, and the per-user sockets need the fronting Caddy.
- name: Stalwart mail server behind Caddy
  hosts: mailservers
  become: true
  # A failed run must still restart Caddy after a group change, or the next
  # run would see no change and never restart it.
  force_handlers: true
  # Every role carries its name as a tag, so one role can be run alone:
  # ansible-playbook playbook.yml --tags caddy_front
  roles:
    - { role: stalwart_install, tags: [stalwart_install] }
    - { role: caddy_front, tags: [caddy_front] }
    - { role: caddy_user_instances, tags: [caddy_user_instances] }
    - { role: stalwart_config, tags: [stalwart_config] }
    - role: bulwark
      tags: [bulwark]
      when: bulwark_enabled | default(false) | bool
