---
# Copy to inventory/group_vars/all.yml (untracked) and fill in. Put every
# secret into an Ansible vault (ansible-vault encrypt_string) or a file that
# is not committed.

stalwart_hostname: mail.example.org
stalwart_admin_user: admin
stalwart_admin_password: "{{ vault_stalwart_admin_password }}"   # >= 12 characters

# Domains served by Stalwart: Caddy fronts their web side and owns their certificates.
stalwart_domains:
  - name: mail.example.org
    state: present
    dns: hetzner            # key into dns_key_map; omit for HTTP-01 / manual DNS
    zone_origin: example.org  # the zone at the provider when `name` is a subdomain of it
    # With dns, one *.mail.example.org certificate covers mta-sts, autoconfig, ...
    # (`wildcard: false` turns that off). Everything on this name goes to Stalwart.
  - name: old.example.org
    state: absent

# Accounts without credentials (set passwords yourself), their aliases, a Sieve forward,
# and a mailing list. See the README, "Accounts, aliases, forwards and lists".
stalwart_accounts:
  - name: alice
    domain: mail.example.org
    aliases: [shop@mail.example.org]
  - name: forwarder
    domain: mail.example.org
    forward_to: alice@elsewhere.example
stalwart_lists:
  - name: team
    domain: mail.example.org
    recipients: [alice@mail.example.org, bob@elsewhere.example]

# Other sites. `user:` forwards to that user's own Caddy.
caddy_domains:
  - name: www.example.org
    state: present
    dns: hetzner
    directive: |
      respond "Hello" 200
  - name: alice.example.org
    state: present
    dns: hetzner
    user: alice

# Pinned build on the controller (see README). Versions a real build resolved
# on 2026-10-28; Caddy itself defaults to v2.11.9. Other providers, for example
# github.com/caddy-dns/gandi@v1.2.1 or github.com/caddy-dns/porkbun@v0.3.1.
caddy_build_method: xcaddy
caddy_xcaddy_modules:
  - github.com/caddy-dns/hetzner/v2@v2.0.1
  - github.com/mholt/caddy-l4/modules/l4proxyprotocol@v0.1.2

dns_key_map:
  hetzner:
    api_token: "{{ vault_hetzner_api_token }}"

# Per-user Caddy instances. Their hosts are served by the front Caddy
# automatically; no caddy_domains entry is needed.
caddy_user_instances:
  - name: alice
    hosts: [alice.example.org]   # forwarded to alice's Caddy by the front Caddy
    sites:
      - name: www                # conf.d/www.conf in alice's ~/.config/caddy
        directive: |
          respond "Hello from alice" 200

stalwart_relay_hosts:
  - name: examplerelay
    address: relay.example.net
    port: 587
    protocol: smtp
    auth_username: relayuser
    auth_secret: "{{ vault_relay_secret }}"

sender_domain_routing:
  - sender: '@bar.example'          # every address of the domain
    route: examplerelay
  - sender: alice@foo.example       # one address; wins over a domain rule
    route: examplerelay
