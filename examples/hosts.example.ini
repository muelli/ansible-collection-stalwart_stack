# One line per host decides whether it runs Stalwart: move the hostname
# between these two groups, nothing else needs touching.
[with_stalwart]
mail.example.org ansible_user=root

[without_stalwart]
# classic.example.org

# Everything below only refers to the two groups above.
[mailservers:children]
with_stalwart

# DebOps only configures its own mail/web stack on hosts without Stalwart.
# Add the debops_service_* groups your hosts normally use.
[debops_all_hosts:children]
with_stalwart
without_stalwart

[debops_service_postfix:children]
without_stalwart

[debops_service_dovecot:children]
without_stalwart

[debops_service_rspamd:children]
without_stalwart

[debops_service_opendkim:children]
without_stalwart

[debops_service_apache:children]
without_stalwart
