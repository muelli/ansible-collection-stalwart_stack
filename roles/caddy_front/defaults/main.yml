---
# --- Binary -----------------------------------------------------------------
# caddy_build_method:
#   download  fetch a build with the plugins from the official build service
#   xcaddy    build on the controller (see below), cache it, copy it to the host
#   binary    copy a prebuilt file from the controller (caddy_binary_src)
caddy_build_method: download

# caddy_dns_plugins are names below github.com/caddy-dns/, caddy_extra_modules
# are complete module paths. Both are used by download and xcaddy.
caddy_dns_plugins: []
caddy_extra_modules: []

# download: replace the whole URL (for example with a release of your own build).
caddy_download_url: >-
  https://caddyserver.com/api/download?os=linux&arch={{ 'amd64' if ansible_facts.architecture == 'x86_64' else 'arm64' }}{% for m in (caddy_dns_plugins | map('regex_replace', '^', 'github.com/caddy-dns/') | list) + caddy_extra_modules %}&p={{ m }}{% endfor %}

# xcaddy: builds happen on the controller, nothing is installed on the target.
# Each entry is what follows `--with`/`--replace` on the xcaddy command line, so
# versions (mod@v1.2.3 or a commit) and replacements (mod=fork@v1) work:
#   caddy_xcaddy_modules: ["github.com/mholt/caddy-l4/modules/l4proxy"]
#   caddy_xcaddy_replaces: ["github.com/libdns/spaceship=github.com/me/fork@v1.1.0"]
caddy_xcaddy_modules: []
caddy_xcaddy_replaces: []
# A version such as v2.11.7, or "latest". Pinned by default for reproducible builds.
caddy_xcaddy_caddy_version: v2.11.7
# podman: run the official caddy builder image with --rm, so the controller
#         needs neither Go nor xcaddy (only podman).
# local:  use the xcaddy found in PATH.
caddy_xcaddy_runner: podman
caddy_builder_image: "docker.io/library/caddy:{{ 'builder' if caddy_xcaddy_caddy_version == 'latest' else (caddy_xcaddy_caddy_version | regex_replace('^v', '')) ~ '-builder' }}"
# Remove the builder image again after a build (it is pulled on every build then).
caddy_builder_remove_image: false
# Finished builds are cached here on the controller, keyed by their inputs.
caddy_build_cache_dir: "{{ playbook_dir }}/.cache/caddy"

# binary: a prebuilt Caddy on the controller, and its sha256.
# caddy_binary_src: /path/to/caddy
# caddy_binary_sha256: "..."

caddy_binary_path: /usr/local/bin/caddy
caddy_marker_dir: /usr/local/share/caddy-front

caddy_user: caddy
caddy_group: caddy
caddy_home: /var/lib/caddy
caddy_config_dir: /etc/caddy
caddy_conf_dir: /etc/caddy/conf.d

# --- TLS --------------------------------------------------------------------
# acme: certificates from acme_directory_url (DNS-01 when a domain sets `dns`)
# internal: Caddy's own local CA, for tests and lab setups
caddy_tls_mode: acme
# https://acme-staging-v02.api.letsencrypt.org/directory
acme_directory_url: https://acme-v02.api.letsencrypt.org/directory
acme_email: "admin@{{ (stalwart_domains | selectattr('state', 'equalto', 'present') | map(attribute='name') | list | first) | default('example.invalid') }}"
# acme_ca_root_pem_path: /etc/ssl/certs/pebble.pem
caddy_storage_dir: "{{ caddy_home }}/.local/share/caddy"
acme_host_slug: "{{ acme_directory_url | regex_replace('^https?://', '') | regex_replace('/.*$', '') }}-directory"
caddy_issuer_dir: "{{ 'local' if caddy_tls_mode == 'internal' else acme_host_slug }}"
caddy_certs_dir: "{{ caddy_storage_dir }}/certificates/{{ caddy_issuer_dir }}"

# --- Sites ------------------------------------------------------------------
# stalwart_domains: names served by Stalwart. Caddy forwards EVERYTHING on them
# to Stalwart's PROXY v2 listener (web UI, JMAP, DAV, discovery, MTA-STS), so
# nothing else can be served on these hostnames; they have no caddy_directive.
# Their certificate is copied to Stalwart for the mail ports.
#   - { name: mail.example.org, state: present, dns: hetzner, zone_origin: example.org }
# Each domain gets one wildcard certificate (DNS-01, so it needs `dns:`; Caddy
# 2.10+ prefers it over per-name ones) for the sites one label below it:
# mta-sts, autoconfig, autodiscover and other stalwart_domains entries such as
# the mail host. The domain itself keeps its own certificate. `wildcard: false`
# gives every name its own certificate instead.
# Subdomains of every Stalwart domain that clients look up over HTTPS: the
# MTA-STS policy, Thunderbird autoconfig and Outlook autodiscover, forwarded to
# Stalwart too. Override per domain with `subdomains: [...]`, or `[]` for none.
stalwart_subdomains: [mta-sts, autoconfig, autodiscover]
stalwart_domains: []
# caddy_domains: all other sites. Give `user: alice` to forward to alice's own
# Caddy over /run/caddy-user-sockets/alice.sock, or a caddy_directive. A name
# must not also be a Stalwart domain or one of its subdomain sites.
# Every host of caddy_user_instances[].sites[].hosts is added automatically as a
# site that forwards to that user (state follows the instance). Listing it in
# caddy_domains as well is fine: that entry wins and is used as written, so use
# it to set `dns:` or other options. The DNS provider of an automatic site is the
# site's own `dns:`, else that of the longest Stalwart domain it lies below, else
# none. An instance with `caddyfile:` and no `sites:` has no known hosts.
# The site `/` of a Stalwart hostname redirects to (see stalwart_config,
# stalwart_redirect_root): www. of the first present Stalwart domain. It gets no
# directives, so Caddy answers with its plain default response. "" disables it.
stalwart_root_site: "{{ ('www.' ~ (stalwart_domains | selectattr('state', 'equalto', 'present') | map(attribute='name') | list | first)) if (stalwart_domains | selectattr('state', 'equalto', 'present') | list | length) > 0 else '' }}"
caddy_domains: []
dns_key_map: {}
caddy_user_socket_dir: /run/caddy-user-sockets

stalwart_http_proxyv2_listener: "{{ stalwart_http_proxy_bind | default('127.0.0.1:8008') }}"
# Origins (scheme://host, exact) of browser apps that may call Stalwart across
# origins, such as https://webmail.example.org for Bulwark. CORS has no
# parent-domain rule; every origin is listed. Caddy answers the preflight and
# sets the headers only for these; others get none. Empty: no CORS at all.
stalwart_cors_origins: []
stalwart_certs_dir: /etc/stalwart/certs
stalwart_user: stalwart
stalwart_group: stalwart
stalwart_bin_dir: /usr/local/bin
stalwart_cli_env_file: /etc/stalwart/cli.env
stalwart_service_name: stalwart

# Verbose Caddy log (ACME and DNS challenge details); see `journalctl -u caddy`.
caddy_debug: false

# How long to wait for the first certificate of a Stalwart domain.
caddy_cert_wait_timeout: 180

# Per-provider details for the Caddy DNS plugins.
caddy_dns_field_map:
  gandi: { layout: anonymous }
  hetzner: { layout: anonymous }
  porkbun:
    layout: block
    fields: { apiKey: api_key, secretApiKey: api_secret_key }
  spaceship:
    layout: block
    fields: { apikey: api_key, apisecret: api_secret }
  ovh:
    layout: block
    fields:
      application_key: application_key
      application_secret: application_secret
      consumer_key: consumer_key

# --- Removal ----------------------------------------------------------------
# absent stops Caddy and removes unit, binary and configuration. The state
# (ACME account, certificates) stays unless caddy_purge_data. Purging also
# removes the certificate copies in stalwart_certs_dir and the Caddy account.
caddy_front_state: present
caddy_purge_data: false
