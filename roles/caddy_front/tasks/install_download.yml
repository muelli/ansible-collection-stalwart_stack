---
- name: Record which Caddy build is installed
  ansible.builtin.stat:
    path: "{{ caddy_marker_dir }}/build-{{ caddy_download_url | hash('sha1') }}"
  register: caddy_build_marker

- name: Download the Caddy binary
  ansible.builtin.get_url:
    url: "{{ caddy_download_url }}"
    dest: "{{ caddy_binary_path }}"
    owner: root
    group: root
    mode: "0755"
    force: "{{ not caddy_build_marker.stat.exists }}"
  notify: Restart Caddy

- name: Mark the Caddy build as installed
  ansible.builtin.file:
    path: "{{ caddy_marker_dir }}/build-{{ caddy_download_url | hash('sha1') }}"
    state: touch
    owner: root
    group: root
    mode: "0644"
    modification_time: preserve
    access_time: preserve
