---
- name: Add the hosts of the user Caddy instances as sites
  ansible.builtin.set_fact:
    # Every name in caddy_user_instances[].hosts becomes a site that forwards
    # everything to that user's socket; what the account does with it is up to
    # the account. A caddy_domains entry of the same name wins and is used as
    # written (set `dns:` there). The DNS provider is that of the longest Stalwart
    # domain the host lies below, else none (HTTP-01 / TLS-ALPN-01).
    caddy_all_domains: >-
      {%- set out = caddy_domains | list -%}
      {%- set seen = namespace(names=caddy_domains | map(attribute='name') | list) -%}
      {%- for inst in caddy_user_instances | default([]) -%}
      {%- set uname = inst.name | default(inst) -%}
      {%- set ustate = inst.state | default(caddy_user_instances_state | default('present')) -%}
      {%- for h in inst.hosts | default([]) -%}
      {%- if h not in seen.names and not h.endswith('.invalid') -%}
      {%- set best = namespace(len=0, dns=none) -%}
      {%- if best.dns is none -%}
      {%- for p in stalwart_domains if p.state | default('present') == 'present' and p.dns is defined and h.endswith('.' ~ p.name) -%}
      {%- if p.name | length > best.len -%}{%- set best.len = p.name | length -%}{%- set best.dns = p.dns -%}{%- endif -%}
      {%- endfor -%}
      {%- endif -%}
      {%- set entry = {'name': h, 'state': ustate, 'user': uname} -%}
      {%- if best.dns is not none -%}{%- set _ = entry.update({'dns': best.dns}) -%}{%- endif -%}
      {%- set _ = out.append(entry) -%}
      {%- set seen.names = seen.names + [h] -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ out }}

- name: Add the host name of Bulwark as a site
  when: bulwark_hostname | default('') | length > 0
  ansible.builtin.set_fact:
    # Forwards to the Bulwark container (see caddy_bulwark_directive). A
    # caddy_domains entry or user instance host of the same name wins and is used
    # as written. The DNS provider is that of the longest Stalwart domain the
    # name lies below, like for the user instance hosts. The site follows
    # bulwark_enabled, so disabling Bulwark removes it.
    caddy_all_domains: >-
      {%- set out = caddy_all_domains | list -%}
      {%- if bulwark_hostname not in (caddy_all_domains | map(attribute='name') | list) -%}
      {%- set best = namespace(len=0, dns=none) -%}
      {%- for p in stalwart_domains if p.state | default('present') == 'present' and p.dns is defined and bulwark_hostname.endswith('.' ~ p.name) -%}
      {%- if p.name | length > best.len -%}{%- set best.len = p.name | length -%}{%- set best.dns = p.dns -%}{%- endif -%}
      {%- endfor -%}
      {%- set entry = {'name': bulwark_hostname, 'state': 'present' if bulwark_enabled | default(false) | bool else 'absent', 'directive': caddy_bulwark_directive} -%}
      {%- if best.dns is not none -%}{%- set _ = entry.update({'dns': best.dns}) -%}{%- endif -%}
      {%- set _ = out.append(entry) -%}
      {%- endif -%}
      {{ out }}
