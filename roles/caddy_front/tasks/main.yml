---
- name: Check the architecture is supported
  ansible.builtin.assert:
    that: ansible_architecture in ['x86_64', 'aarch64']
    fail_msg: caddy_front only knows x86_64 and aarch64.

- name: Reject domains with an unknown state
  ansible.builtin.fail:
    msg: "Domain '{{ item.name }}' has the unknown state '{{ item.state | default('') }}' (use present or absent)."
  loop: "{{ stalwart_domains + caddy_domains }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.state | default('present') not in ['present', 'absent']

- name: Create the Caddy group
  ansible.builtin.group:
    name: "{{ caddy_group }}"
    system: true

- name: Create the Caddy user
  ansible.builtin.user:
    name: "{{ caddy_user }}"
    group: "{{ caddy_group }}"
    home: "{{ caddy_home }}"
    create_home: true
    shell: /usr/sbin/nologin
    system: true

- name: Create Caddy directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ caddy_config_dir }}"
    - "{{ caddy_conf_dir }}"
    - "{{ caddy_marker_dir }}"

- name: Record which Caddy build is installed
  ansible.builtin.stat:
    path: "{{ caddy_marker_dir }}/build-{{ caddy_download_url | hash('sha1') }}"
  register: caddy_build_marker

- name: Download the Caddy binary
  ansible.builtin.get_url:
    url: "{{ caddy_download_url }}"
    dest: "{{ caddy_binary_path }}"
    owner: root
    group: root
    mode: "0755"
    force: "{{ not caddy_build_marker.stat.exists }}"
  notify: Restart Caddy

- name: Mark the Caddy build as installed
  ansible.builtin.file:
    path: "{{ caddy_marker_dir }}/build-{{ caddy_download_url | hash('sha1') }}"
    state: touch
    owner: root
    group: root
    mode: "0644"
    modification_time: preserve
    access_time: preserve

- name: Install the Caddy systemd unit
  ansible.builtin.template:
    src: caddy.service.j2
    dest: /etc/systemd/system/caddy.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd for Caddy
    - Restart Caddy

- name: Write the DNS credentials
  ansible.builtin.template:
    src: dns.env.j2
    dest: "{{ caddy_config_dir }}/dns.env"
    owner: root
    group: "{{ caddy_group }}"
    mode: "0640"
  no_log: true
  notify: Restart Caddy

- name: Write the Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ caddy_config_dir }}/Caddyfile"
    owner: root
    group: root
    mode: "0644"
  notify: Reload Caddy

- name: Remove the site files of absent domains
  ansible.builtin.file:
    path: "{{ caddy_conf_dir }}/{{ item.name }}.conf"
    state: absent
  loop: "{{ stalwart_domains + caddy_domains }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.state | default('present') == 'absent'
  notify: Reload Caddy

- name: Write the site files of Stalwart domains
  ansible.builtin.template:
    src: site.conf.j2
    dest: "{{ caddy_conf_dir }}/{{ item.name }}.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ stalwart_domains | selectattr('state', 'equalto', 'present') | map('combine', {'kind': 'stalwart'}) | list }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload Caddy

- name: Write the site files of other domains
  ansible.builtin.template:
    src: site.conf.j2
    dest: "{{ caddy_conf_dir }}/{{ item.name }}.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ caddy_domains | selectattr('state', 'equalto', 'present') | map('combine', {'kind': 'web'}) | list }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload Caddy

- name: Create the directory Stalwart reads certificates from
  ansible.builtin.file:
    path: "{{ stalwart_certs_dir }}"
    state: directory
    owner: "{{ stalwart_user }}"
    group: "{{ stalwart_group }}"
    mode: "0750"

- name: Install the certificate sync units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - stalwart-cert-sync@.service
    - stalwart-cert-sync@.path
  notify: Reload systemd for Caddy

- name: Look for other services on the HTTP and HTTPS ports
  ansible.builtin.command:
    argv: [ss, -H, -ltnp, "( sport = :80 or sport = :443 )"]
  register: caddy_port_users
  changed_when: false

- name: Refuse to start Caddy while another service holds port 80 or 443
  ansible.builtin.fail:
    msg: >-
      Port 80 or 443 is already in use by something other than Caddy:
      {{ caddy_port_users.stdout_lines | reject('search', 'caddy') | join(' | ') }}
      Stop or move that service (for example the Apache or nginx role of DebOps).
  when: caddy_port_users.stdout_lines | reject('search', 'caddy') | list | length > 0

- name: Start Caddy and apply pending changes
  ansible.builtin.meta: flush_handlers

- name: Enable and start Caddy
  ansible.builtin.systemd_service:
    name: caddy
    state: started
    enabled: true

- name: Check which certificates Stalwart already has
  ansible.builtin.stat:
    path: "{{ stalwart_certs_dir }}/{{ item.name }}.crt"
  loop: "{{ stalwart_domains | selectattr('state', 'equalto', 'present') | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: stalwart_local_certs

- name: Wait for Caddy to obtain missing certificates
  ansible.builtin.wait_for:
    path: "{{ caddy_certs_dir }}/{{ item.item.name }}/{{ item.item.name }}.crt"
    timeout: "{{ caddy_cert_wait_timeout }}"
  loop: "{{ stalwart_local_certs.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not item.stat.exists

- name: Copy the first certificates to Stalwart
  ansible.builtin.copy:
    src: "{{ caddy_certs_dir }}/{{ item.0.item.name }}/{{ item.0.item.name }}.{{ item.1 }}"
    dest: "{{ stalwart_certs_dir }}/{{ item.0.item.name }}.{{ item.1 }}"
    remote_src: true
    owner: "{{ stalwart_user }}"
    group: "{{ stalwart_group }}"
    mode: "{{ '0644' if item.1 == 'crt' else '0600' }}"
  loop: "{{ stalwart_local_certs.results | product(['crt', 'key']) | list }}"
  loop_control:
    label: "{{ item.0.item.name }}.{{ item.1 }}"
  when: not item.0.stat.exists

- name: Watch Caddy certificate renewals of present Stalwart domains
  ansible.builtin.systemd_service:
    name: "stalwart-cert-sync@{{ item.name }}.path"
    state: started
    enabled: true
  loop: "{{ stalwart_domains | selectattr('state', 'equalto', 'present') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Stop watching absent Stalwart domains
  ansible.builtin.systemd_service:
    name: "stalwart-cert-sync@{{ item.name }}.path"
    state: stopped
    enabled: false
  loop: "{{ stalwart_domains | selectattr('state', 'equalto', 'absent') | list }}"
  loop_control:
    label: "{{ item.name }}"
  failed_when: false

- name: Remove certificate files of absent Stalwart domains
  ansible.builtin.file:
    path: "{{ stalwart_certs_dir }}/{{ item.0.name }}.{{ item.1 }}"
    state: absent
  loop: "{{ stalwart_domains | selectattr('state', 'equalto', 'absent') | product(['crt', 'key']) | list }}"
  loop_control:
    label: "{{ item.0.name }}.{{ item.1 }}"
