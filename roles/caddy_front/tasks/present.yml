---
- name: Check the architecture is supported
  ansible.builtin.assert:
    that: ansible_facts.architecture in ['x86_64', 'aarch64']
    fail_msg: caddy_front only knows x86_64 and aarch64.

- name: Reject domains with an unknown state
  ansible.builtin.fail:
    msg: "Domain '{{ item.name }}' has the unknown state '{{ item.state | default('') }}' (use present or absent)."
  loop: "{{ stalwart_domains + caddy_domains }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.state | default('present') not in ['present', 'absent']

- name: Create the Caddy group
  ansible.builtin.group:
    name: "{{ caddy_group }}"
    system: true

- name: Create the Caddy user
  ansible.builtin.user:
    name: "{{ caddy_user }}"
    group: "{{ caddy_group }}"
    home: "{{ caddy_home }}"
    create_home: true
    shell: /usr/sbin/nologin
    system: true

- name: Create Caddy directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ caddy_config_dir }}"
    - "{{ caddy_conf_dir }}"
    - "{{ caddy_marker_dir }}"

- name: Install the Caddy binary
  ansible.builtin.include_tasks: "install_{{ caddy_build_method }}.yml"

- name: Install the Caddy systemd unit
  ansible.builtin.template:
    src: caddy.service.j2
    dest: /etc/systemd/system/caddy.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd for Caddy
    - Restart Caddy

- name: Write the DNS credentials
  ansible.builtin.template:
    src: dns.env.j2
    dest: "{{ caddy_config_dir }}/dns.env"
    owner: root
    group: "{{ caddy_group }}"
    mode: "0640"
  no_log: true
  notify: Restart Caddy

- name: Work out the subdomain sites of the Stalwart domains
  ansible.builtin.set_fact:
    caddy_stalwart_subdomain_sites: >-
      {%- set out = [] -%}
      {%- for d in stalwart_domains -%}
      {%- for s in d.subdomains | default(stalwart_subdomains) -%}
      {%- set _ = out.append(d | combine({'name': s ~ '.' ~ d.name, 'parent': d.name, 'kind': 'stalwart'})) -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ out }}

- name: Work out which Stalwart domains get a wildcard certificate
  ansible.builtin.set_fact:
    # Every present domain unless `wildcard: false`. Needs DNS-01, so a `dns:`
    # provider (or the internal CA).
    caddy_wildcard_parents: >-
      {%- set out = [] -%}
      {%- for d in stalwart_domains if d.state == 'present' and d.wildcard | default(true) -%}
      {%- if caddy_tls_mode == 'internal' or d.dns is defined -%}{%- set _ = out.append(d.name) -%}{%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: Check that no Caddy site clashes with a Stalwart name
  ansible.builtin.assert:
    that:
      - >-
        (caddy_domains | rejectattr('state', 'equalto', 'absent') | map(attribute='name') | list)
        | intersect((stalwart_domains + caddy_stalwart_subdomain_sites) | selectattr('state', 'equalto', 'present') | map(attribute='name') | list)
        | length == 0
      - >-
        stalwart_root_site not in (caddy_domains | rejectattr('state', 'equalto', 'absent') | map(attribute='name') | list
        + (stalwart_domains + caddy_stalwart_subdomain_sites) | selectattr('state', 'equalto', 'present') | map(attribute='name') | list)
    fail_msg: >-
      caddy_domains must not contain names of stalwart_domains, their subdomain sites or the
      root site {{ stalwart_root_site }} (everything on Stalwart hostnames goes to Stalwart).

- name: Work out which Caddy certificate serves each Stalwart name
  ansible.builtin.set_fact:
    # name -> directory name in Caddy's certificate storage. A name one label
    # below a wildcard domain is served by that domain's wildcard certificate.
    caddy_cert_source: >-
      {%- set src = {} -%}
      {%- set names = (stalwart_domains | selectattr('state', 'equalto', 'present') | map(attribute='name') | list)
                      + (caddy_stalwart_subdomain_sites | selectattr('state', 'equalto', 'present') | map(attribute='name') | list) -%}
      {%- for n in names -%}
      {%- set ns = namespace(v=n) -%}
      {%- for p in caddy_wildcard_parents -%}
      {%- if n.endswith('.' ~ p) and (n.split('.') | length) == (p.split('.') | length) + 1 -%}{%- set ns.v = 'wildcard_.' ~ p -%}{%- endif -%}
      {%- endfor -%}
      {%- set _ = src.update({n: ns.v}) -%}
      {%- endfor -%}
      {{ src }}

- name: Write the Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ caddy_config_dir }}/Caddyfile"
    owner: root
    group: root
    mode: "0644"
  notify: Reload Caddy

- name: Remove the site files of absent domains
  ansible.builtin.file:
    path: "{{ caddy_conf_dir }}/{{ item.name }}.conf"
    state: absent
  loop: "{{ stalwart_domains + caddy_stalwart_subdomain_sites + caddy_domains }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.state | default('present') == 'absent'
  notify: Reload Caddy

- name: Write the site files of Stalwart domains
  ansible.builtin.template:
    src: site.conf.j2
    dest: "{{ caddy_conf_dir }}/{{ item.name }}.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ ((stalwart_domains | selectattr('state', 'equalto', 'present') | map('combine', {'kind': 'stalwart'}) | list)
            + (caddy_stalwart_subdomain_sites | selectattr('state', 'equalto', 'present') | list))
            }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload Caddy

- name: Write the wildcard site files
  ansible.builtin.template:
    src: wildcard.conf.j2
    dest: "{{ caddy_conf_dir }}/_wildcard.{{ item }}.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ caddy_wildcard_parents }}"
  notify: Reload Caddy

- name: Remove the wildcard site files that are no longer wanted
  ansible.builtin.file:
    path: "{{ caddy_conf_dir }}/_wildcard.{{ item.name }}.conf"
    state: absent
  loop: "{{ stalwart_domains }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in caddy_wildcard_parents
  notify: Reload Caddy

- name: Work out the root site
  ansible.builtin.set_fact:
    caddy_root_site: >-
      {%- if stalwart_root_site | length > 0 -%}
      {%- set parent = stalwart_domains | selectattr('state', 'equalto', 'present') | selectattr('dns', 'defined')
                       | selectattr('name', 'equalto', stalwart_root_site.split('.')[1:] | join('.')) | list -%}
      {{ {'name': stalwart_root_site, 'kind': 'web'} | combine({'dns': parent[0].dns} if parent else {}) }}
      {%- else -%}
      {}
      {%- endif -%}

- name: Write the root site
  ansible.builtin.template:
    src: site.conf.j2
    dest: "{{ caddy_conf_dir }}/_root.conf"
    owner: root
    group: root
    mode: "0644"
  vars:
    item: "{{ caddy_root_site }}"
  when: caddy_root_site | length > 0
  notify: Reload Caddy

- name: Remove the root site when it is disabled
  ansible.builtin.file:
    path: "{{ caddy_conf_dir }}/_root.conf"
    state: absent
  when: caddy_root_site | length == 0
  notify: Reload Caddy

- name: Write the site files of other domains
  ansible.builtin.template:
    src: site.conf.j2
    dest: "{{ caddy_conf_dir }}/{{ item.name }}.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ caddy_domains | selectattr('state', 'equalto', 'present') | map('combine', {'kind': 'web'}) | list }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload Caddy

- name: Create the directory Stalwart reads certificates from
  ansible.builtin.file:
    path: "{{ stalwart_certs_dir }}"
    state: directory
    owner: "{{ stalwart_user }}"
    group: "{{ stalwart_group }}"
    mode: "0750"

- name: Install the certificate sync units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - stalwart-cert-sync@.service
    - stalwart-cert-sync@.path
  notify: Reload systemd for Caddy

- name: Create or remove the drop-in directories of the sync units
  ansible.builtin.file:
    path: "/etc/systemd/system/stalwart-cert-sync@{{ item.0.name }}.{{ item.1 }}.d"
    state: "{{ 'directory' if caddy_cert_source[item.0.name].startswith('wildcard_') else 'absent' }}"
    owner: root
    group: root
    mode: "0755"
  loop: "{{ stalwart_domains | selectattr('state', 'equalto', 'present') | product(['service', 'path']) | list }}"
  loop_control:
    label: "{{ item.0.name }}.{{ item.1 }}"
  notify: Reload systemd for Caddy

- name: Point the sync units of wildcard-covered names at the wildcard certificate
  ansible.builtin.template:
    src: "stalwart-cert-sync-wildcard.{{ item.1 }}.conf.j2"
    dest: "/etc/systemd/system/stalwart-cert-sync@{{ item.0.name }}.{{ item.1 }}.d/wildcard.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ stalwart_domains | selectattr('state', 'equalto', 'present') | product(['service', 'path']) | list }}"
  loop_control:
    label: "{{ item.0.name }}.{{ item.1 }}"
  when: caddy_cert_source[item.0.name].startswith('wildcard_')
  notify: Reload systemd for Caddy

- name: Look for other services on the HTTP and HTTPS ports
  ansible.builtin.command:
    argv: [ss, -H, -ltnp, "( sport = :80 or sport = :443 )"]
  register: caddy_port_users
  changed_when: false

- name: Refuse to start Caddy while another service holds port 80 or 443
  ansible.builtin.fail:
    msg: >-
      Port 80 or 443 is already in use by something other than Caddy:
      {{ caddy_port_users.stdout_lines | reject('search', 'caddy') | join(' | ') }}
      Stop or move that service (for example the Apache or nginx role of DebOps).
  when: caddy_port_users.stdout_lines | reject('search', 'caddy') | list | length > 0

- name: Start Caddy and apply pending changes
  ansible.builtin.meta: flush_handlers

- name: Enable and start Caddy
  ansible.builtin.systemd_service:
    name: caddy
    state: started
    enabled: true

- name: Check which certificates Stalwart already has
  ansible.builtin.stat:
    path: "{{ stalwart_certs_dir }}/{{ item.name }}.crt"
  loop: "{{ stalwart_domains | selectattr('state', 'equalto', 'present') | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: stalwart_local_certs

- name: List the names whose certificate Caddy has to provide
  ansible.builtin.set_fact:
    # The Stalwart domains that Stalwart has no copy of yet, and every
    # subdomain site (those are served by Caddy only, nothing is copied).
    caddy_names_to_wait: >-
      {{ stalwart_local_certs.results | rejectattr('stat.exists') | map(attribute='item.name') | list
         + (caddy_stalwart_subdomain_sites | selectattr('state', 'equalto', 'present') | map(attribute='name') | list) }}

- name: Wait for Caddy to obtain missing certificates
  block:
    - name: Wait for the certificate files
      ansible.builtin.wait_for:
        path: "{{ caddy_certs_dir }}/{{ caddy_cert_source[item] }}/{{ caddy_cert_source[item] }}.crt"
        timeout: "{{ caddy_cert_wait_timeout }}"
      loop: "{{ caddy_names_to_wait }}"
  rescue:
    - name: Find this run of the Caddy service in the journal
      ansible.builtin.command:
        argv: [systemctl, show, caddy, --property=InvocationID, --value]
      register: caddy_invocation
      changed_when: false
      failed_when: false

    - name: Collect the Caddy log of this run
      ansible.builtin.command:
        argv: >-
          {{ ['journalctl', '--no-pager', '-o', 'cat', '--lines=3000']
             + (['_SYSTEMD_INVOCATION_ID=' ~ (caddy_invocation.stdout | trim)] if caddy_invocation.stdout | trim | length > 0 else ['-u', 'caddy']) }}
      register: caddy_failure_log
      changed_when: false
      failed_when: false

    - name: Pick the last certificate error per name from the log
      ansible.builtin.set_fact:
        caddy_cert_errors: >-
          {% set d = {} %}{% for l in caddy_failure_log.stdout_lines %}{% if l is match('^[{].*[}]$') %}{% set j = l | from_json %}{% if j.identifier is defined and j.error is defined and j.level | default('') in ['error', 'warn', 'warning'] %}{% set _ = d.update({j.identifier: (j.error | string | regex_replace('^.*?(HTTP [0-9]+ )', '\\1') | truncate(500))}) %}{% endif %}{% endif %}{% endfor %}{{ d }}
        caddy_other_problems: >-
          {% set out = [] %}{% for l in caddy_failure_log.stdout_lines %}{% if l is match('^[{].*[}]$') %}{% set j = l | from_json %}{% if j.level | default('') in ['warn', 'warning', 'error', 'fatal', 'panic'] and j.identifier is not defined and j.msg | default('') not in ['will retry', 'job failed', 'could not get certificate from issuer'] %}{% set _ = out.append(('%H:%M:%S' | strftime(j.ts | default(0) | int)) ~ ' ' ~ j.level ~ ' ' ~ j.logger | default('') ~ ': ' ~ j.msg | default('') ~ (' - ' ~ (j.error | string | truncate(300)) if j.error is defined else '')) %}{% endif %}{% endif %}{% endfor %}{{ (out | unique | list)[-10:] }}

    - name: Check which certificates are still missing
      ansible.builtin.stat:
        path: "{{ caddy_certs_dir }}/{{ caddy_cert_source[item] }}/{{ caddy_cert_source[item] }}.crt"
      loop: "{{ caddy_names_to_wait }}"
      register: caddy_still_missing

    - name: Fail with the reason per missing certificate
      ansible.builtin.fail:
        msg: |-
          Caddy did not produce a certificate within {{ caddy_cert_wait_timeout }}s. Last error per name:
          {% for r in caddy_still_missing.results | rejectattr('stat.exists') %}
            {{ r.item }}: {{ caddy_cert_errors[caddy_cert_source[r.item] | replace('wildcard_.', '*.')] | default('nothing logged; check that the name is served by Caddy and read the journal') }}
          {% endfor %}
          {% if caddy_other_problems | length > 0 %}
          Other warnings and errors from Caddy:
          {% for l in caddy_other_problems %}
            {{ l }}
          {% endfor %}
          {% endif %}
          Full log: journalctl -u caddy on {{ inventory_hostname }} (caddy_debug: true adds ACME and DNS challenge details).
          Common causes:
          * DNS-01 (`dns:` set): wrong or missing credentials in dns_key_map, or the DNS plugin was not built in
            (caddy_dns_plugins / caddy_xcaddy_modules)
          * HTTP-01 / TLS-ALPN-01 (no `dns:`): the name does not resolve to this host, or ports 80/443 are not reachable
          * the ACME server rejected the name or rate-limited it (acme_directory_url can point at the staging CA)

- name: Copy the first certificates to Stalwart
  ansible.builtin.copy:
    src: "{{ caddy_certs_dir }}/{{ caddy_cert_source[item.0.item.name] }}/{{ caddy_cert_source[item.0.item.name] }}.{{ item.1 }}"
    dest: "{{ stalwart_certs_dir }}/{{ item.0.item.name }}.{{ item.1 }}"
    remote_src: true
    owner: "{{ stalwart_user }}"
    group: "{{ stalwart_group }}"
    mode: "{{ '0644' if item.1 == 'crt' else '0600' }}"
  loop: "{{ stalwart_local_certs.results | product(['crt', 'key']) | list }}"
  loop_control:
    label: "{{ item.0.item.name }}.{{ item.1 }}"
  when: not item.0.stat.exists

- name: Watch Caddy certificate renewals of present Stalwart domains
  ansible.builtin.systemd_service:
    name: "stalwart-cert-sync@{{ item.name }}.path"
    state: started
    enabled: true
  loop: "{{ stalwart_domains | selectattr('state', 'equalto', 'present') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Stop watching absent Stalwart domains
  ansible.builtin.systemd_service:
    name: "stalwart-cert-sync@{{ item.name }}.path"
    state: stopped
    enabled: false
  loop: "{{ stalwart_domains | selectattr('state', 'equalto', 'absent') | list }}"
  loop_control:
    label: "{{ item.name }}"
  failed_when: false

- name: Remove certificate files of absent Stalwart domains
  ansible.builtin.file:
    path: "{{ stalwart_certs_dir }}/{{ item.0.name }}.{{ item.1 }}"
    state: absent
  loop: "{{ stalwart_domains | selectattr('state', 'equalto', 'absent') | product(['crt', 'key']) | list }}"
  loop_control:
    label: "{{ item.0.name }}.{{ item.1 }}"
