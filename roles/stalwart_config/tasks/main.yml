---
- name: Default the state of every domain, account and mailing list to present
  ansible.builtin.set_fact:
    stalwart_domains: >-
      {%- set out = [] -%}
      {%- for d in stalwart_domains -%}{%- set _ = out.append({'state': 'present'} | combine(d)) -%}{%- endfor -%}
      {{ out }}
    stalwart_accounts_norm: >-
      {%- set out = [] -%}
      {%- for d in stalwart_accounts -%}{%- set _ = out.append({'state': 'present'} | combine(d)) -%}{%- endfor -%}
      {{ out }}
    stalwart_lists_norm: >-
      {%- set out = [] -%}
      {%- for d in stalwart_lists -%}{%- set _ = out.append({'state': 'present'} | combine(d)) -%}{%- endfor -%}
      {{ out }}
    stalwart_groups_norm: >-
      {%- set out = [] -%}
      {%- for d in stalwart_groups -%}{%- set _ = out.append({'state': 'present'} | combine(d)) -%}{%- endfor -%}
      {{ out }}
    stalwart_collections_norm: >-
      {%- set out = [] -%}
      {%- for d in stalwart_collections -%}{%- set _ = out.append({'state': 'present'} | combine(d)) -%}{%- endfor -%}
      {{ out }}

- name: Check required variables
  ansible.builtin.assert:
    that:
      - stalwart_admin_password is defined
      - stalwart_hostname is defined
    fail_msg: stalwart_admin_password and stalwart_hostname must be set.
  no_log: true

# Only the mail check, nothing applied: `just check-mail` in bitbox sets this.
- name: Check the mail DNS records and the TLS of the MX hosts, without applying anything
  ansible.builtin.include_tasks: check_mail_dns.yml
  when: stalwart_check_mail_only | bool

- name: Stop here when only the mail check was asked for
  ansible.builtin.meta: end_role
  when: stalwart_check_mail_only | bool

- name: Check that every certificate the plan references exists
  ansible.builtin.stat:
    path: "{{ stalwart_certs_dir }}/{{ item.name }}.{{ ext }}"
  loop: >-
    {{ stalwart_domains | selectattr('state', 'equalto', 'present') | list
       + ([{'name': stalwart_hostname}]
          if stalwart_hostname not in (stalwart_domains | selectattr('state', 'equalto', 'present') | map(attribute='name') | list) else []) }}
  loop_control:
    label: "{{ item.name }}"
  vars:
    ext: crt
  register: stalwart_cert_stats

- name: Fail when a referenced certificate is missing
  ansible.builtin.fail:
    msg: >-
      {{ item.stat.path }} does not exist. Run the caddy_front role first so Caddy obtains
      the certificate and the cert-sync unit copies it.
  loop: "{{ stalwart_cert_stats.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not item.stat.exists

- name: Reject relay and routing combinations that break SPF
  ansible.builtin.include_tasks: check_relay_spf.yml

- name: Check whether the server has been bootstrapped before
  ansible.builtin.stat:
    path: "{{ stalwart_config_dir }}/.bootstrapped"
  register: stalwart_sentinel

- name: Work out the addresses of accounts and lists that are to be removed
  ansible.builtin.set_fact:
    stalwart_absent_accounts: >-
      {%- set out = [] -%}
      {%- for e in stalwart_accounts_norm | selectattr('state', 'equalto', 'absent') -%}{%- set _ = out.append({'address': e.name ~ '@' ~ e.domain}) -%}{%- endfor -%}
      {{ out }}
    stalwart_absent_lists: >-
      {%- set out = [] -%}
      {%- for e in stalwart_lists_norm | selectattr('state', 'equalto', 'absent') -%}{%- set _ = out.append({'address': e.name ~ '@' ~ e.domain}) -%}{%- endfor -%}
      {{ out }}
    stalwart_absent_groups: >-
      {%- set out = [] -%}
      {%- for e in stalwart_groups_norm | selectattr('state', 'equalto', 'absent') -%}{%- set _ = out.append({'address': e.name ~ '@' ~ e.domain}) -%}{%- endfor -%}
      {{ out }}

- name: Remove accounts, groups and mailing lists that are marked absent
  ansible.builtin.include_tasks: absent_addresses.yml
  when:
    - stalwart_sentinel.stat.exists
    - (stalwart_absent_accounts + stalwart_absent_lists + stalwart_absent_groups) | length > 0

- name: Look up the server ids of domains that are to be removed
  ansible.builtin.command:
    argv: ["{{ stalwart_bin_dir }}/stalwart-cli", query, Domain, --where, "name={{ item.name }}", --fields, name, --json, --no-color]
  environment:
    STALWART_URL: "{{ stalwart_mgmt_url }}"
    STALWART_USER: "{{ stalwart_admin_user }}"
    STALWART_PASSWORD: "{{ stalwart_admin_password }}"
  loop: "{{ stalwart_domains | selectattr('state', 'equalto', 'absent') | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: stalwart_absent_lookup
  changed_when: false
  failed_when: false
  when: stalwart_sentinel.stat.exists

- name: Remember the ids (Stalwart created DKIM keys that link to them)
  ansible.builtin.set_fact:
    stalwart_absent_domain_ids: >-
      {% set d = {} %}{% for r in stalwart_absent_lookup.results | default([]) if r.rc | default(1) == 0 and r.stdout | default('') | length > 0 %}{% set _ = d.update({r.item.name: (r.stdout.splitlines()[0] | from_json).id}) %}{% endfor %}{{ d }}

- name: Render the plan of destroys that have to come first
  ansible.builtin.template:
    src: plan-pre.ndjson.j2
    dest: "{{ stalwart_config_dir }}/plan-pre.ndjson"
    owner: root
    group: root
    mode: "0600"
  register: stalwart_pre_plan

- name: Render the declarative plan
  ansible.builtin.template:
    src: plan.ndjson.j2
    dest: "{{ stalwart_config_dir }}/plan.ndjson"
    owner: root
    group: root
    mode: "0600"
  # The plan carries DNS and relay secrets, so keep it out of the log and diff.
  no_log: true
  diff: false
  register: stalwart_plan

- name: Read the checksum of the plan that was applied last
  ansible.builtin.slurp:
    src: "{{ stalwart_config_dir }}/.plan.applied"
  register: stalwart_applied_plan
  failed_when: false

- name: Checksum the rendered plans
  ansible.builtin.stat:
    path: "{{ stalwart_config_dir }}/plan.ndjson"
    checksum_algorithm: sha256
  register: stalwart_plan_stat

- name: Decide whether the plan has to be applied
  ansible.builtin.set_fact:
    stalwart_plan_checksum: "{{ stalwart_plan_stat.stat.checksum ~ '+' ~ (stalwart_pre_plan.checksum | default('')) }}"
    stalwart_apply_needed: >-
      {{ (stalwart_applied_plan.content | default('') | b64decode | trim) != (stalwart_plan_stat.stat.checksum ~ '+' ~ (stalwart_pre_plan.checksum | default('')))
         or not stalwart_sentinel.stat.exists or stalwart_force_apply | bool }}

- name: Apply the destroys that have to come first
  ansible.builtin.command:
    argv: ["{{ stalwart_bin_dir }}/stalwart-cli", apply, --file, "{{ stalwart_config_dir }}/plan-pre.ndjson", --quiet, --no-color]
  environment:
    STALWART_URL: "{{ stalwart_mgmt_url }}"
    STALWART_USER: "{{ stalwart_admin_user }}"
    STALWART_PASSWORD: "{{ stalwart_admin_password }}"
  changed_when: true
  when:
    - stalwart_apply_needed | bool
    - stalwart_sentinel.stat.exists
    - stalwart_absent_domain_ids | length > 0

- name: List the applications of the server
  ansible.builtin.command:
    argv: ["{{ stalwart_bin_dir }}/stalwart-cli", query, Application, --fields, description, --json, --no-color]
  environment:
    STALWART_URL: "{{ stalwart_mgmt_url }}"
    STALWART_USER: "{{ stalwart_admin_user }}"
    STALWART_PASSWORD: "{{ stalwart_admin_password }}"
  register: stalwart_application_list
  changed_when: false
  failed_when: false
  when:
    - stalwart_sentinel.stat.exists
    - stalwart_applications | selectattr('state', 'defined') | selectattr('state', 'equalto', 'absent') | list | length > 0

- name: Work out the ids of the applications that are to be removed
  ansible.builtin.set_fact:
    # Stalwart cannot filter Application objects, so destroy-by-description does
    # not work; match the listing here and delete by id.
    stalwart_absent_application_ids: >-
      {%- set gone = stalwart_applications | selectattr('state', 'defined') | selectattr('state', 'equalto', 'absent') | map(attribute='description') | list -%}
      {%- set out = [] -%}
      {%- for l in stalwart_application_list.stdout_lines | default([]) if l is match('^[{]') -%}
      {%- set o = l | from_json -%}
      {%- if o.description | default('') in gone -%}{%- set _ = out.append(o.id) -%}{%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: Remove the applications that are marked absent
  ansible.builtin.command:
    argv: ["{{ stalwart_bin_dir }}/stalwart-cli", delete, Application, --ids, "{{ stalwart_absent_application_ids | join(',') }}", --no-color]
  environment:
    STALWART_URL: "{{ stalwart_mgmt_url }}"
    STALWART_USER: "{{ stalwart_admin_user }}"
    STALWART_PASSWORD: "{{ stalwart_admin_password }}"
  changed_when: true
  when: stalwart_absent_application_ids | length > 0

- name: Apply the plan through the running management listener
  ansible.builtin.command:
    argv: ["{{ stalwart_bin_dir }}/stalwart-cli", apply, --file, "{{ stalwart_config_dir }}/plan.ndjson", --quiet, --no-color]
  environment:
    STALWART_URL: "{{ stalwart_mgmt_url }}"
    STALWART_USER: "{{ stalwart_admin_user }}"
    STALWART_PASSWORD: "{{ stalwart_admin_password }}"
  register: stalwart_apply_mgmt
  changed_when: stalwart_apply_mgmt.rc == 0
  failed_when: false
  when:
    - stalwart_apply_needed | bool
    - stalwart_sentinel.stat.exists

- name: Make the running server read the new settings
  ansible.builtin.command:
    argv: ["{{ stalwart_bin_dir }}/stalwart-cli", create, Action/ReloadSettings, --json, "{}", --no-color]
  environment:
    STALWART_URL: "{{ stalwart_mgmt_url }}"
    STALWART_USER: "{{ stalwart_admin_user }}"
    STALWART_PASSWORD: "{{ stalwart_admin_password }}"
  changed_when: true
  when:
    - stalwart_apply_needed | bool
    - stalwart_sentinel.stat.exists
    - stalwart_apply_mgmt.rc | default(1) == 0

- name: Make the running server fetch new or changed application bundles
  ansible.builtin.command:
    argv: ["{{ stalwart_bin_dir }}/stalwart-cli", create, Action/UpdateApps, --json, "{}", --no-color]
  environment:
    STALWART_URL: "{{ stalwart_mgmt_url }}"
    STALWART_USER: "{{ stalwart_admin_user }}"
    STALWART_PASSWORD: "{{ stalwart_admin_password }}"
  changed_when: true
  when:
    - stalwart_applications | length > 0
    - stalwart_apply_needed | bool
    - stalwart_sentinel.stat.exists
    - stalwart_apply_mgmt.rc | default(1) == 0

- name: Decide whether the recovery instance is needed
  ansible.builtin.set_fact:
    stalwart_apply_via_recovery: "{{ stalwart_apply_needed | bool and (not stalwart_sentinel.stat.exists or (stalwart_apply_mgmt.rc | default(1)) != 0) }}"

- name: Report why the management listener could not be used
  ansible.builtin.debug:
    msg: "{{ (stalwart_apply_mgmt.stderr | default('') ~ ' ' ~ stalwart_apply_mgmt.stdout | default('')) | trim }}"
  when:
    - stalwart_apply_via_recovery | bool
    - stalwart_sentinel.stat.exists

- name: Bootstrap or repair through a temporary recovery instance
  when:
    - stalwart_apply_needed | bool
    - stalwart_apply_via_recovery | bool
  block:
    - name: Stop the regular service
      ansible.builtin.systemd_service:
        name: "{{ stalwart_service_name }}"
        state: stopped
      failed_when: false

    - name: Start Stalwart in recovery mode
      ansible.builtin.command:
        argv:
          - systemd-run
          - "--unit={{ stalwart_recovery_unit }}"
          - --collect
          - "--uid={{ stalwart_system_user | default('stalwart') }}"
          - "--gid={{ stalwart_system_group | default('stalwart') }}"
          - --setenv=STALWART_RECOVERY_MODE=1
          - "--setenv=STALWART_RECOVERY_MODE_PORT={{ stalwart_recovery_port }}"
          - "--setenv=STALWART_RECOVERY_ADMIN={{ stalwart_admin_user }}:{{ stalwart_admin_password }}"
          - "{{ stalwart_bin_dir }}/stalwart"
          - --config
          - "{{ stalwart_config_dir }}/config.json"
      no_log: true
      changed_when: true

    - name: Wait for the recovery listener
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ stalwart_recovery_port }}"
        timeout: 60

    - name: Apply the plan through the recovery instance
      ansible.builtin.command:
        argv: ["{{ stalwart_bin_dir }}/stalwart-cli", apply, --file, "{{ stalwart_config_dir }}/plan.ndjson", --quiet, --no-color]
      environment:
        STALWART_URL: "http://127.0.0.1:{{ stalwart_recovery_port }}"
        STALWART_USER: "{{ stalwart_admin_user }}"
        STALWART_PASSWORD: "{{ stalwart_admin_password }}"
      changed_when: true

    - name: Mark the deployment as bootstrapped
      ansible.builtin.file:
        path: "{{ stalwart_config_dir }}/.bootstrapped"
        state: touch
        owner: root
        group: root
        mode: "0644"
        modification_time: preserve
        access_time: preserve
  rescue:
    - name: Read the log of the recovery instance
      ansible.builtin.command:
        argv: [journalctl, -u, "{{ stalwart_recovery_unit }}", --no-pager, -o, cat, --since=-10min]
      register: stalwart_recovery_log
      changed_when: false
      failed_when: false

    - name: Fail with the log of the recovery instance
      ansible.builtin.fail:
        msg: |-
          Bootstrapping through the recovery instance failed. Log of {{ stalwart_recovery_unit }}:
          {% for l in stalwart_recovery_log.stdout_lines | map('regex_replace', '\\x1b\\[[0-9;]*m', '') | select | unique | list %}
            {{ l | truncate(400) }}
          {% endfor %}
          What stalwart-cli said: {{ ((stalwart_apply_mgmt.stderr | default('')) ~ ' ' ~ (ansible_failed_result.stderr | default(''))) | trim | truncate(600) }}
          {# Enrichment, only after a failure: the plan is the authority, so nothing is checked beforehand. #}
          {% if (((stalwart_apply_mgmt.stderr | default('')) ~ (ansible_failed_result.stderr | default(''))) is search('unresolved id|Id reference .* not found')) %}
          {% set present_domains = stalwart_domains | selectattr('state', 'equalto', 'present') | map(attribute='name') | list %}
          {% set refs = namespace(l=[]) %}
          {% for e in stalwart_accounts_norm + stalwart_lists_norm + stalwart_groups_norm if e.state == 'present' %}
          {% set refs.l = refs.l + [e.domain] %}
          {% for a in e.aliases | default([]) %}{% set refs.l = refs.l + [(a if a is string else a.address).split('@')[1]] %}{% endfor %}
          {% endfor %}
          Hint: accounts, lists or aliases refer to domain(s) {{ refs.l | unique | reject('in', present_domains) | list | join(', ') }} that are not present entries of stalwart_domains.
          Add the domain, or mark the entries that use it `state: absent` (also when the domain itself is being removed).
          {% endif %}
          {% if (((stalwart_apply_mgmt.stderr | default('')) ~ (ansible_failed_result.stderr | default(''))) is search('unresolved id|Id reference .* not found|memberGroupIds')) %}
          {% set group_addrs = stalwart_groups_norm | selectattr('state', 'equalto', 'present') | map(attribute='name') | zip(stalwart_groups_norm | selectattr('state', 'equalto', 'present') | map(attribute='domain')) | map('join', '@') | list %}
          {% set used = namespace(l=[]) %}
          {% for e in stalwart_accounts_norm if e.state == 'present' %}{% set used.l = used.l + (e.groups | default([])) %}{% endfor %}
          {% if used.l | unique | reject('in', group_addrs) | list | length > 0 %}
          Hint: accounts list the group(s) {{ used.l | unique | reject('in', group_addrs) | list | join(', ') }} in `groups`, which are not present entries of stalwart_groups.
          {% endif %}
          {% endif %}
          {% if stalwart_recovery_log.stdout is search('prior to 1\\.0|Unsupported database schema') %}
          Cause: {{ stalwart_data_dir | default('/var/lib/stalwart') }} holds a data store written by a 0.x Stalwart, which 1.x cannot open.
          Stop the service and move that directory away (for example mv {{ stalwart_data_dir | default('/var/lib/stalwart') }} {{ stalwart_data_dir | default('/var/lib/stalwart') }}-0x), then run again.
          {% endif %}
          More: journalctl -u {{ stalwart_recovery_unit }} -u {{ stalwart_service_name }} --no-pager -n 100 on {{ inventory_hostname }}
  always:
    - name: Make sure the recovery instance is gone
      ansible.builtin.systemd_service:
        name: "{{ stalwart_recovery_unit }}"
        state: stopped
      failed_when: false

    - name: Wait for the recovery port to be released
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ stalwart_recovery_port }}"
        state: stopped
        timeout: 30
      failed_when: false

    - name: Bring the regular service back even if the apply failed
      ansible.builtin.systemd_service:
        name: "{{ stalwart_service_name }}"
        state: started
      failed_when: false

- name: Remember the applied plan
  ansible.builtin.copy:
    content: "{{ stalwart_plan_checksum }}\n"
    dest: "{{ stalwart_config_dir }}/.plan.applied"
    owner: root
    group: root
    mode: "0644"
  when:
    - stalwart_apply_needed | bool
    - stalwart_apply_via_recovery | bool or (stalwart_apply_mgmt.rc | default(1)) == 0

- name: Start and enable the Stalwart service
  ansible.builtin.systemd_service:
    name: "{{ stalwart_service_name }}"
    state: started
    enabled: "{{ stalwart_service_enabled | default(true) }}"

- name: Install or remove the Sieve forwards of accounts
  ansible.builtin.include_tasks: forwards.yml
  when: stalwart_accounts_norm | rejectattr('state', 'equalto', 'absent') | selectattr('forward_to', 'defined') | list | length > 0

- name: Recipient policies - remove absent entries and reload the lookup lists
  ansible.builtin.include_tasks: policies.yml
  when: stalwart_recipient_policies | length > 0

- name: Remove the webhooks that are marked absent
  ansible.builtin.include_tasks: webhooks.yml
  when: stalwart_webhooks | selectattr('state', 'defined') | selectattr('state', 'equalto', 'absent') | list | length > 0

- name: Manage folders, calendars and address books and who they are shared with
  ansible.builtin.include_tasks: collections.yml
  when: stalwart_collections_norm | length > 0

# Stalwart lists the DNS records it wants for a domain, among them one CNAME per
# subdomain that clients fetch over HTTPS (mta-sts, autoconfig, ...). Caddy has
# to serve each of them, so compare the two; a name Stalwart adds in a later
# release then fails the run instead of going unnoticed. Needs caddy_front in the
# same play, and skips domains that set their own `subdomains`.
- name: Check that Caddy serves the subdomains Stalwart wants DNS records for
  when:
    - stalwart_check_zone | bool
    - caddy_stalwart_subdomain_sites is defined
  block:
    - name: Wait for the management listener
      ansible.builtin.wait_for:
        host: "{{ stalwart_mgmt_bind.rsplit(':', 1)[0] }}"
        port: "{{ stalwart_mgmt_bind.rsplit(':', 1)[1] | int }}"
        timeout: 60

    - name: List the domains of the server
      ansible.builtin.command:
        argv: ["{{ stalwart_bin_dir }}/stalwart-cli", query, Domain, --fields, name, --json, --no-color]
      environment:
        STALWART_URL: "{{ stalwart_mgmt_url }}"
        STALWART_USER: "{{ stalwart_admin_user }}"
        STALWART_PASSWORD: "{{ stalwart_admin_password }}"
      register: stalwart_domain_query
      changed_when: false

    - name: Pick the domains to check
      ansible.builtin.set_fact:
        stalwart_zone_domains: >-
          {%- set want = stalwart_domains | selectattr('state', 'equalto', 'present') | rejectattr('subdomains', 'defined') | map(attribute='name') | list -%}
          {%- set out = [] -%}
          {%- for l in stalwart_domain_query.stdout_lines if l is match('^[{]') -%}
          {%- set o = l | from_json -%}
          {%- if o.name in want -%}{%- set _ = out.append(o) -%}{%- endif -%}
          {%- endfor -%}
          {{ out }}

    - name: Read the zone file of each domain
      ansible.builtin.command:
        argv: ["{{ stalwart_bin_dir }}/stalwart-cli", get, Domain, "{{ item.id }}", --fields, "name,dnsZoneFile", --json, --no-color]
      environment:
        STALWART_URL: "{{ stalwart_mgmt_url }}"
        STALWART_USER: "{{ stalwart_admin_user }}"
        STALWART_PASSWORD: "{{ stalwart_admin_password }}"
      loop: "{{ stalwart_zone_domains }}"
      loop_control:
        label: "{{ item.name }}"
      register: stalwart_zone_files
      changed_when: false

    - name: Work out the subdomains in the zone files that Caddy does not serve
      ansible.builtin.set_fact:
        stalwart_zone_missing: >-
          {%- set out = [] -%}
          {%- for r in stalwart_zone_files.results -%}
          {%- set zone = (r.stdout | from_json).dnsZoneFile | default('') -%}
          {%- set owners = zone | regex_findall('(?m)^(\S+?)\.?\s+IN\s+CNAME\s') -%}
          {%- set served = caddy_stalwart_subdomain_sites | selectattr('state', 'equalto', 'present') | map(attribute='name') | list -%}
          {%- for o in owners if o not in served -%}{%- set _ = out.append(o) -%}{%- endfor -%}
          {%- endfor -%}
          {{ out | unique | list }}

    - name: Fail when Stalwart wants a subdomain Caddy does not serve
      ansible.builtin.assert:
        that: stalwart_zone_missing | length == 0
        fail_msg: >-
          Stalwart publishes DNS records (CNAME) for {{ stalwart_zone_missing | join(', ') }}, but caddy_front serves no
          site there. Add the label to stalwart_subdomains (or the domain's `subdomains`), or set
          stalwart_check_zone: false.

# A new stalwart_hostname changes the MX and the client-configuration and MTA-STS CNAMEs, which
# Stalwart only rewrites when a DnsManagement task runs: start those where public DNS is stale.
- name: Publish the records that name a stale host again
  ansible.builtin.include_tasks: dns_republish.yml
  when:
    - stalwart_dns_republish | bool
    - not ansible_check_mode

# Do the records Stalwart wants exist in public DNS, and is the certificate of every MX host valid
# for its name? Reports by default; stalwart_check_mail_fatal: true fails the run.
- name: Check the mail DNS records and the TLS of the MX hosts
  ansible.builtin.include_tasks: check_mail_dns.yml
  when:
    - stalwart_check_mail | bool
    - not ansible_check_mode
