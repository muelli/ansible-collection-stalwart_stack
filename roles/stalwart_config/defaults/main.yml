---
# Needs stalwart_install on the same host. Written for Stalwart 1.0.x;
# object and field names differ from 0.16 (for example Relay.host,
# NetworkListener.implicitTls).

# defaultHostname of the server (used in the SMTP greeting, MTA reports...).
# stalwart_hostname: mail.example.org

# Domain that SystemSettings.defaultDomainId points to. Defaults to the
# first present entry of stalwart_domains.
stalwart_default_domain: "{{ (stalwart_domains | selectattr('state', 'equalto', 'present') | map(attribute='name') | list | first) | default('') }}"

# One entry per domain. Fields:
#   name: mail.example.org
#   state: present | absent
#   dns: hetzner            # key into dns_key_map; Stalwart then publishes the DNS records
#   zone_origin: example.org  # DNS zone at the provider if it is a parent of `name`
#                           # (Stalwart's "Zone Origin"); needed for subdomains of a zone
#   subdomains: [...]       # mta-sts, autoconfig, ... sites, see caddy_front
#   wildcard: false         # no wildcard certificate (default: one per domain with dns), see caddy_front
# Caddy forwards everything on these hostnames to Stalwart; serve other sites
# through caddy_domains.
stalwart_domains: []

# Where `/` on every Stalwart hostname redirects to (Http.redirectRoot; Stalwart
# itself answers 404 there when it is unset, and defaults to /account). The
# default is www. of the first present domain, which caddy_front serves with
# Caddy's plain default answer (same variable and default in caddy_front). Set
# it to a URL of your own, or "" to leave Stalwart's setting alone.
stalwart_root_site: "{{ ('www.' ~ (stalwart_domains | selectattr('state', 'equalto', 'present') | map(attribute='name') | list | first)) if (stalwart_domains | selectattr('state', 'equalto', 'present') | list | length) > 0 else '' }}"
stalwart_redirect_root: "{{ ('https://' ~ stalwart_root_site ~ '/') if stalwart_root_site | length > 0 else '' }}"

# Stalwart's own switch (Http.usePermissiveCors) allows every origin. Leave it
# off and list the webmail origin in caddy_front's stalwart_cors_origins instead.
stalwart_permissive_cors: false

# Entries of stalwart_domains, stalwart_relay_hosts and stalwart_server_listeners
# with `state: absent` are destroyed in Stalwart. DNS providers that are no
# longer wanted (names as in dns_key_map) go here:
stalwart_absent_dns_providers: []

# Filled in during the run: server ids of the domains to remove.
stalwart_absent_domain_ids: {}

# Outbound relays (smarthosts), created as Stalwart MtaRoute objects of type
# Relay and matched by name. A relay does nothing until a rule in
# sender_domain_routing below points a sender domain at it.
#   - name: examplerelay            # referenced by `route:` in sender_domain_routing
#     address: relay.example.net    # host name or IP of the relay
#     port: 587                     # default 25
#     protocol: smtp                # default
#     implicit_tls: false           # default; true for TLS from the first byte (port 465)
#     allow_invalid_certs: false    # default; true only for a relay with a self-signed cert
#     auth_username: relayuser      # optional, together with auth_secret
#     auth_secret: "{{ vault_relay_secret }}"   # keep it in an Ansible vault, never in plain text
#     manages_spf: false            # default; true if the relay sends with its own return-path
#                                   # domain (SMTP2GO, ...), see sender_domain_routing below
#     description: Mail via the example relay   # optional
#     state: present                # default; absent destroys the relay in Stalwart
stalwart_relay_hosts: []

# Web applications Stalwart downloads (zip bundle) and serves under URL prefixes
# (Application objects, matched by description; `state: absent` destroys one).
# Stalwart's own interface (/admin, /account) exists by default and is not
# touched. Stalwart accepts only single path segments as prefixes (/app, not
# / or /a/b), so an application cannot take over `/`; that stays with
# stalwart_redirect_root. auto_update_interval is in milliseconds.
#   - description: Some app
#     url_prefix: [/app]
#     resource_url: https://example.org/bundle.zip
#     enable: true                  # default
#     auto_update_interval: 7776000000
stalwart_applications: []

# Which sender domain is sent through which relay. The envelope sender domain
# is compared, the first matching rule wins, mail for local recipients always
# stays local, and everything else is delivered directly by MX lookup. Without
# a matching rule there is no relay.
#   - domain: bar.example           # domain mail is sent from
#     route: examplerelay           # `name` of an entry of stalwart_relay_hosts
#     state: present                # default; absent drops the rule
# Notes: such a domain must not set `dns:` in stalwart_domains, because the
# automatic DNS records would overwrite its SPF record. Publish SPF yourself and
# include what the relay provider asks for (for example
# `v=spf1 mx include:spf.relay.example.net -all`). Exception: with
# `manages_spf: true` on the relay the check is skipped. Providers that verify
# the domain with their own return-path CNAME (SMTP2GO) make SPF of the sender
# domain irrelevant for relayed mail, and DMARC still aligns on the subdomain. Stalwart still signs the
# mail with the domain's own DKIM key; if the relay re-signs, publish the
# provider's DKIM record as well.
sender_domain_routing: []

dns_key_map: {}

# Certificates are written to this directory by caddy_front.
stalwart_certs_dir: /etc/stalwart/certs

stalwart_config_dir: /etc/stalwart
stalwart_bin_dir: /usr/local/bin
stalwart_service_name: stalwart
stalwart_admin_user: admin
stalwart_mgmt_url: "http://{{ stalwart_mgmt_bind }}"

# Port of the temporary recovery instance used for the first apply.
stalwart_recovery_port: 8080
stalwart_recovery_unit: stalwart-recovery

# Re-apply the plan even when it did not change.
stalwart_force_apply: false

# Loopback address of the HTTP listener Caddy talks to with PROXY protocol v2.
stalwart_http_proxy_bind: "127.0.0.1:8008"
stalwart_proxy_trusted_networks: ["127.0.0.1/32", "::1/128"]

# SystemSettings.proxyTrustedNetworks applies to EVERY listener, including the
# plain management listener, so it stays empty. Only the http-proxy listener
# expects PROXY protocol, through its own overrideProxyTrustedNetworks.
stalwart_global_proxy_trusted_networks: []

# Loopback-only plain HTTP listener used by stalwart-cli after bootstrap.
stalwart_mgmt_bind: "127.0.0.1:8081"

stalwart_server_listeners:
  - { name: smtp, protocol: smtp, bind: ["[::]:25"] }
  - { name: submission, protocol: smtp, bind: ["[::]:587"], options: { useTls: true } }
  - { name: submissions, protocol: smtp, bind: ["[::]:465"], options: { implicitTls: true } }
  - { name: imap, protocol: imap, bind: ["[::]:143"], options: { useTls: true } }
  - { name: imaps, protocol: imap, bind: ["[::]:993"], options: { implicitTls: true } }
  - { name: sieve, protocol: manageSieve, bind: ["[::]:4190"], options: { useTls: true } }

# Listeners the roles depend on: Caddy forwards to http-proxy with PROXY
# protocol v2, stalwart-cli and Bulwark use mgmt. They are always part of the
# plan, even when stalwart_server_listeners is overridden; an entry of the same
# name in stalwart_server_listeners replaces the one below.
stalwart_required_listeners:
  - name: http-proxy
    protocol: http
    bind: ["{{ stalwart_http_proxy_bind }}"]
    options:
      overrideProxyTrustedNetworks: "{{ stalwart_proxy_trusted_networks }}"
  - { name: mgmt, protocol: http, bind: ["{{ stalwart_mgmt_bind }}"] }

# Extra operations appended verbatim to the generated plan.
stalwart_additional_plan: []

# Mapping from the provider key used in `dns:` to the Stalwart DnsServer type
# and from the Caddy credential names in dns_key_map to Stalwart field names.
stalwart_dns_provider_map:
  gandi: GandiV5
  hetzner: Hetzner
  spaceship: Spaceship
  porkbun: Porkbun
  ovh: Ovh
  dnsimple: Dnsimple

stalwart_dns_field_meta:
  gandi:
    bearer_token: { name: secret, type: SecretKey }
  hetzner:
    api_token: { name: secret, type: SecretKey }
  spaceship:
    apikey: { name: apiKeyId, type: String }
    apisecret: { name: secret, type: SecretKey }
  porkbun:
    api_key: { name: apiKeyId, type: String }
    api_secret: { name: secret, type: SecretKey }
  ovh:
    application_key: { name: applicationKey, type: String }
    application_secret: { name: applicationSecret, type: SecretKey }
    consumer_key: { name: consumerKey, type: SecretKey }
  dnsimple:
    auth_token: { name: token, type: SecretKey }
    account_id: { name: accountIdentifier, type: String }
