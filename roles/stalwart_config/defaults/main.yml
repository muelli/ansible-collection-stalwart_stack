---
# Needs stalwart_install on the same host. Written for Stalwart 1.0.x;
# object and field names differ from 0.16 (for example Relay.host,
# NetworkListener.implicitTls).

# defaultHostname of the server (used in the SMTP greeting, MTA reports...). It
# is where Stalwart listens and what the MX and SRV records point at; it is not
# a mail domain, so it needs no stalwart_domains entry. Its certificate is the
# one of the wildcard of the mail domain it lies below, or its own.
# stalwart_hostname: mail.example.org

# Domain that SystemSettings.defaultDomainId points to. Defaults to the
# first present entry of stalwart_domains.
stalwart_default_domain: "{{ (stalwart_domains | selectattr('state', 'equalto', 'present') | map(attribute='name') | list | first) | default('') }}"

# One entry per domain. Fields:
#   name: mail.example.org
#   state: present | absent
#   dns: hetzner            # key into dns_key_map; Stalwart then publishes the DNS records
#   zone_origin: example.org  # DNS zone at the provider if it is a parent of `name`
#                           # (Stalwart's "Zone Origin"); needed for subdomains of a zone
#   subdomains: [...]       # mta-sts, autoconfig, ... sites, see caddy_front
#   catch_all: postmaster@example.org  # receives mail for unknown local recipients of this
#                           # domain (Domain.catchAllAddress); must be an existing address.
#                           # Left out, the server's value is kept; null (`catch_all: ~`)
#                           # or "" clears it
#   wildcard: false         # no wildcard certificate (default: one per domain with dns), see caddy_front
#   serve_http: true        # Caddy forwards everything on the domain's name to Stalwart
#                           # (default false: the name is free for a site of yours)
stalwart_domains: []

# Accounts (Account objects of type User, matched by name and domain). Credentials
# are not managed here: a new account has none and cannot log in (it still receives
# mail), and an update never touches the password of an existing one.
#   - name: muelli                  # local part
#     domain: example.org           # must be in stalwart_domains
#     state: present                # default; absent DELETES the account and its mail
#     description: Tobias           # optional
#     aliases:                      # optional; full addresses on any domain of stalwart_domains.
#       - ebay@example.org          # The role owns the list: other aliases are removed. Left out
#       - shop@other.example        # keeps the server's aliases, [] removes them all.
#       - {address: old@example.org, enabled: false}   # kept, but refuses mail (550 at RCPT TO)
#     forward_to: me@elsewhere.org  # optional; a Sieve script `stalwart-forward` redirects every
#                                   # message to this one address. The envelope sender becomes the
#                                   # account's own address, which keeps SPF at the receiver
#                                   # passing (a list or catch-all keeps the original sender and
#                                   # fails SPF for mail from other domains), and DKIM stays intact.
#                                   # The script becomes the account's ACTIVE script; others are kept
#                                   # but inactive. Left out leaves the scripts alone; null or "" removes
#                                   # ours. One address only: Stalwart allows one redirect per script by
#                                   # default; use a stalwart_lists entry for several targets.
#     forward_keep_copy: false      # default; true also keeps the message in the mailbox
#     groups: [support@example.org] # optional; the groups the account is a member of (Account.memberGroupIds,
#                                   # entries of stalwart_groups). Members see the group's mailbox, calendar
#                                   # and address book as extra accounts and may send as the group address.
#                                   # Left out keeps the memberships, [] removes them all.
stalwart_accounts: []

# Groups (Account objects of type Group, matched by name and domain): a shared mailbox,
# calendar and address book with an address of its own (support@, info@). Members are
# declared on the accounts (`groups:` above), as Stalwart stores them. A group cannot log in
# itself, and mail to it (or its aliases) lands in its own Inbox.
#   - name: support
#     domain: example.org           # must be in stalwart_domains
#     aliases: [help@example.org]   # optional, like for accounts
#     description: Support team     # optional
#     state: present                # default; absent DELETES the group and its mail, and fails
#                                   # while an account still lists it in `groups`
stalwart_groups: []

# Folders, calendars and address books of accounts and groups, and who they are shared with.
# Everything is done over JMAP as the administrator. Every account and group already has a
# default calendar ("Stalwart Calendar (<address>)") and address book, plus the usual mail
# folders (Inbox, Sent Items, ...); name one of them to manage only its sharing.
#   - owner: alice@example.org      # account or group address
#     kind: folder                  # folder | calendar | addressbook
#     name: Projects/Alpha          # a folder path with /, created with its parents when missing
#     share_with:                   # optional; replaces the whole sharing list of this one collection.
#       bob@example.org: [mayReadItems, mayAddItems, maySetSeen]   # Left out keeps it, {} removes it.
#       support@example.org: [mayReadItems]                        # JMAP rights, as Stalwart names them:
#                                   # folder: mayReadItems mayAddItems mayRemoveItems maySetSeen
#                                   #   maySetKeywords mayCreateChild mayRename mayDelete maySubmit
#                                   #   mayShare maySetMetadata
#                                   # calendar: mayReadFreeBusy mayReadItems mayWriteAll mayWriteOwn
#                                   #   mayUpdatePrivate mayRSVP mayShare mayDelete maySetMetadata
#                                   # addressbook: mayRead mayWrite mayDelete mayShare maySetMetadata
#     state: present                # default; absent DELETES the collection (see remove_content)
#     remove_content: false         # absent only: also delete the mail, events or contacts inside
# Sharing is not inherited: a sub-folder needs its own entry. Two collections of one owner
# with the same name are an error (rename or delete one yourself). Principals a share names
# are matched by address; removing an account removes it from the shares on its own.
stalwart_collections: []

# Mailing lists (MailingList objects, matched by name and domain). They expand to
# any addresses, local or external, and keep the original envelope sender.
#   - name: team
#     domain: example.org
#     recipients: [a@example.org, b@elsewhere.org]
#     aliases: [crew@example.org]   # optional, like for accounts
#     description: The team         # optional
#     state: present                # default; absent destroys the list
# A whole-domain catch-all that forwards is a list plus `catch_all:` of the domain
# pointing at it (catch_all: team@example.org).
stalwart_lists: []

# What to do with mail to certain recipient addresses, for example the one address you gave
# one correspondent that now receives spam. Works for explicit aliases and for addresses a
# catch-all accepts. Entries are key-value entries of a lookup list, `RCPT-POLICY` is one spam
# rule of the `Email` variant that looks up every address of a message, and three spam tags
# carry out the action.
#   - address: ebay@example.org     # lowercase; a glob with * or ? matches many ('block-*@example.org')
#     action: spam                  # spam    deliver to Junk (a score of stalwart_recipient_policy_spam_score)
#                                   # discard accept and silently drop (the sender sees success)
#                                   # reject  refuse after DATA with 550 (the sender sees an error)
#     state: present                # default; absent deletes the entry
# Limits, measured on Stalwart 1.1.0: the verdict is for the whole message, so a mail to a listed
# and an unlisted address is rejected or discarded for BOTH; the rule looks at every address of the
# message (headers as well as envelope), so a listed address in From:/Cc: counts too; reject comes
# after DATA, not at RCPT TO. To refuse at RCPT TO instead, set an explicit alias to
# {address: ..., enabled: false} (see `aliases` above).
stalwart_recipient_policies: []
stalwart_recipient_policy_namespace: rcpt-policy
stalwart_recipient_policy_spam_score: 20

# Where `/` on the Stalwart host name redirects to (Http.redirectRoot). "" leaves
# Stalwart's setting alone, which is /account.
stalwart_redirect_root: ""

# After the apply, compare the CNAME records Stalwart wants for each domain with
# the subdomain sites caddy_front serves, and fail on a difference.
stalwart_check_zone: true

# Stalwart's own switch (Http.usePermissiveCors) allows every origin. Leave it
# off and list the webmail origin in caddy_front's stalwart_cors_origins instead.
stalwart_permissive_cors: false

# Entries of stalwart_domains, stalwart_relay_hosts and stalwart_server_listeners
# with `state: absent` are destroyed in Stalwart. DNS providers that are no
# longer wanted (names as in dns_key_map) go here:
stalwart_absent_dns_providers: []

# Filled in during the run: server ids of the domains to remove.
stalwart_absent_domain_ids: {}

# Outbound relays (smarthosts), created as Stalwart MtaRoute objects of type
# Relay and matched by name. A relay does nothing until a rule in
# sender_domain_routing below points a sender domain at it.
#   - name: examplerelay            # referenced by `route:` in sender_domain_routing
#     address: relay.example.net    # host name or IP of the relay
#     port: 587                     # default 25
#     protocol: smtp                # default
#     implicit_tls: false           # default; true for TLS from the first byte (port 465)
#     allow_invalid_certs: false    # default; true only for a relay with a self-signed cert
#     auth_username: relayuser      # optional, together with auth_secret
#     auth_secret: "{{ vault_relay_secret }}"   # keep it in an Ansible vault, never in plain text
#     manages_spf: false            # default; true if the relay sends with its own return-path
#                                   # domain (SMTP2GO, ...), see sender_domain_routing below
#     description: Mail via the example relay   # optional
#     state: present                # default; absent destroys the relay in Stalwart
stalwart_relay_hosts: []

# Web applications Stalwart downloads (zip bundle) and serves under URL prefixes
# (Application objects, matched by description; `state: absent` destroys one).
# Stalwart's own interface (/admin, /account) exists by default and is not
# touched. Stalwart accepts only single path segments as prefixes (/app, not
# / or /a/b), so an application cannot take over `/`; that stays with
# stalwart_redirect_root. auto_update_interval is in milliseconds.
#   - description: Some app
#     url_prefix: [/app]
#     resource_url: https://example.org/bundle.zip
#     enable: true                  # default
#     auto_update_interval: 7776000000
stalwart_applications: []

# Which sender is sent through which relay. The envelope sender is compared;
# `user@host` matches that address, `@host` every address of the domain (as in
# Postfix's sender_dependent_relayhost_maps). Address rules are tried before
# domain rules whatever their order here, otherwise the first match wins. Mail
# for local recipients always stays local, and everything else is delivered
# directly by MX lookup. Without a matching rule there is no relay.
#   - sender: tobias@foo.example    # one address ...
#     route: examplerelay           # `name` of an entry of stalwart_relay_hosts
#   - sender: '@bar.example'        # ... or a whole domain (quote it in YAML)
#     route: otherrelay
#     state: present                # default; absent drops the rule
# Notes: the domain of such a sender must not set `dns:` in stalwart_domains, because the
# automatic DNS records would overwrite its SPF record. Publish SPF yourself and
# include what the relay provider asks for (for example
# `v=spf1 mx include:spf.relay.example.net -all`). Exception: with
# `manages_spf: true` on the relay the check is skipped. Providers that verify
# the domain with their own return-path CNAME (SMTP2GO) make SPF of the sender
# domain irrelevant for relayed mail, and DMARC still aligns on the subdomain. Stalwart still signs the
# mail with the domain's own DKIM key; if the relay re-signs, publish the
# provider's DKIM record as well.
sender_domain_routing: []

dns_key_map: {}

# Certificates are written to this directory by caddy_front.
stalwart_certs_dir: /etc/stalwart/certs

stalwart_config_dir: /etc/stalwart
stalwart_bin_dir: /usr/local/bin
stalwart_service_name: stalwart
stalwart_admin_user: admin
stalwart_mgmt_url: "http://{{ stalwart_mgmt_bind }}"

# Port of the temporary recovery instance used for the first apply.
stalwart_recovery_port: 8080
stalwart_recovery_unit: stalwart-recovery

# Re-apply the plan even when it did not change.
stalwart_force_apply: false

# Loopback address of the HTTP listener Caddy talks to with PROXY protocol v2.
stalwart_http_proxy_bind: "127.0.0.1:8008"
stalwart_proxy_trusted_networks: ["127.0.0.1/32", "::1/128"]

# SystemSettings.proxyTrustedNetworks applies to EVERY listener, including the
# plain management listener, so it stays empty. Only the http-proxy listener
# expects PROXY protocol, through its own overrideProxyTrustedNetworks.
stalwart_global_proxy_trusted_networks: []

# Loopback-only plain HTTP listener used by stalwart-cli after bootstrap.
stalwart_mgmt_bind: "127.0.0.1:8081"

stalwart_server_listeners:
  - { name: smtp, protocol: smtp, bind: ["[::]:25"] }
  - { name: submission, protocol: smtp, bind: ["[::]:587"], options: { useTls: true } }
  - { name: submissions, protocol: smtp, bind: ["[::]:465"], options: { implicitTls: true } }
  - { name: imap, protocol: imap, bind: ["[::]:143"], options: { useTls: true } }
  - { name: imaps, protocol: imap, bind: ["[::]:993"], options: { implicitTls: true } }
  - { name: sieve, protocol: manageSieve, bind: ["[::]:4190"], options: { useTls: true } }

# Listeners the roles depend on: Caddy forwards to http-proxy with PROXY
# protocol v2, stalwart-cli and Bulwark use mgmt. They are always part of the
# plan, even when stalwart_server_listeners is overridden; an entry of the same
# name in stalwart_server_listeners replaces the one below.
stalwart_required_listeners:
  - name: http-proxy
    protocol: http
    bind: ["{{ stalwart_http_proxy_bind }}"]
    options:
      overrideProxyTrustedNetworks: "{{ stalwart_proxy_trusted_networks }}"
  - { name: mgmt, protocol: http, bind: ["{{ stalwart_mgmt_bind }}"] }

# Extra operations appended verbatim to the generated plan.
stalwart_additional_plan: []

# Mapping from the provider key used in `dns:` to the Stalwart DnsServer type
# and from the Caddy credential names in dns_key_map to Stalwart field names.
stalwart_dns_provider_map:
  gandi: GandiV5
  hetzner: Hetzner
  spaceship: Spaceship
  porkbun: Porkbun
  ovh: Ovh
  dnsimple: Dnsimple

stalwart_dns_field_meta:
  gandi:
    bearer_token: { name: secret, type: SecretKey }
  hetzner:
    api_token: { name: secret, type: SecretKey }
  spaceship:
    apikey: { name: apiKeyId, type: String }
    apisecret: { name: secret, type: SecretKey }
  porkbun:
    api_key: { name: apiKeyId, type: String }
    api_secret: { name: secret, type: SecretKey }
  ovh:
    application_key: { name: applicationKey, type: String }
    application_secret: { name: applicationSecret, type: SecretKey }
    consumer_key: { name: consumerKey, type: SecretKey }
  dnsimple:
    auth_token: { name: token, type: SecretKey }
    account_id: { name: accountIdentifier, type: String }
