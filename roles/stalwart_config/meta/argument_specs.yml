---
argument_specs:
  main:
    short_description: Configure a running Stalwart (domains, listeners, relays, applications, DNS) through its management API
    description: Needs stalwart_install on the same host. Every variable also has a comment in defaults/main.yml.
    options:
      stalwart_hostname: {type: str, description: "defaultHostname of the server; MX and SRV records point at it. Needs no stalwart_domains entry."}
      stalwart_default_domain: {type: str, description: "Domain of SystemSettings.defaultDomainId; defaults to the first present domain."}
      stalwart_domains:
        type: list
        elements: dict
        default: []
        description: One entry per mail domain.
        options:
          name: {type: str, required: true, description: "The domain."}
          state: {type: str, default: present, choices: [present, absent], description: "absent destroys the domain in Stalwart."}
          dns: {type: str, description: "DNS provider key (dns_key_map); Stalwart then publishes the records."}
          zone_origin: {type: str, description: "DNS zone at the provider when it is a parent of name."}
          subdomains: {type: list, elements: str, description: "Overrides stalwart_subdomains; [] for none."}
          catch_all: {type: str, description: "Catch-all address, which must exist. Left out keeps the server's value; null or '' clears it."}
          wildcard: {type: bool, default: true, description: "false: no wildcard certificate."}
          serve_http: {type: bool, default: false, description: "true: Caddy forwards everything on the domain's own name to Stalwart."}
      stalwart_accounts:
        type: list
        elements: dict
        default: []
        description: Accounts (name and domain; no credentials are managed).
        options:
          name: {type: str, required: true, description: "Local part of the account."}
          domain: {type: str, required: true, description: "Domain of the account; must be in stalwart_domains."}
          state: {type: str, default: present, choices: [present, absent], description: "absent deletes the account and its mail."}
          description: {type: str, description: "Free text."}
          aliases: {type: list, elements: raw, description: "Full addresses on domains of stalwart_domains, or {address, enabled: false} to keep an alias that refuses mail. The role owns the list: others are removed; [] removes all; left out keeps the server's."}
          forward_to: {type: str, description: "One address every message is redirected to by the Sieve script stalwart-forward. null or '' removes the script; left out leaves the scripts alone."}
          forward_keep_copy: {type: bool, default: false, description: "Also keep the message in the mailbox."}
          groups: {type: list, elements: str, description: "Addresses of the stalwart_groups entries the account belongs to. [] removes all memberships; left out keeps them."}
      stalwart_groups:
        type: list
        elements: dict
        default: []
        description: Groups, a shared mailbox, calendar and address book with their own address. Members are set on the accounts (groups).
        options:
          name: {type: str, required: true, description: "Local part of the group address."}
          domain: {type: str, required: true, description: "Domain of the group; must be in stalwart_domains."}
          state: {type: str, default: present, choices: [present, absent], description: "absent deletes the group and its mail; fails while an account is still a member."}
          aliases: {type: list, elements: raw, description: "Further addresses of the group (an address, or {address, enabled: false})."}
          description: {type: str, description: "Free text."}
      stalwart_collections:
        type: list
        elements: dict
        default: []
        description: Folders, calendars and address books of accounts and groups and who they are shared with.
        options:
          owner: {type: str, required: true, description: "Address of the account or group that owns the collection."}
          kind: {type: str, required: true, choices: [folder, calendar, addressbook], description: "What it is."}
          name: {type: str, required: true, description: "Name; a folder path uses /."}
          state: {type: str, default: present, choices: [present, absent], description: "absent deletes the collection."}
          share_with: {type: dict, description: "Address (account or group) to the list of JMAP rights; replaces the sharing list; {} removes all; left out keeps it."}
          properties: {type: dict, description: "Other JMAP properties by their JMAP names (color, description, sortOrder, isSubscribed, timeZone, isDefault ...); compared and written only when listed."}
          rename_from: {type: str, description: "Old name (same folder): renamed in place if it exists and name does not; fails if both exist."}
          remove_content: {type: bool, default: false, description: "absent only: delete the mail, events or contacts inside as well."}
      stalwart_lists:
        type: list
        elements: dict
        default: []
        description: Mailing lists, expanding to any addresses, with the original envelope sender kept.
        options:
          name: {type: str, required: true, description: "Local part of the list address."}
          domain: {type: str, required: true, description: "Domain of the list; must be in stalwart_domains."}
          state: {type: str, default: present, choices: [present, absent], description: "absent destroys the list."}
          recipients: {type: list, elements: str, default: [], description: "Member addresses, local or external."}
          aliases: {type: list, elements: raw, description: "Further addresses of the list (an address, or {address, enabled: false})."}
          description: {type: str, description: "Free text."}
      stalwart_recipient_policies:
        type: list
        elements: dict
        default: []
        description: What to do with mail to certain recipient addresses (spam, discard or reject).
        options:
          address: {type: str, required: true, description: "Recipient address, or a glob with * or ?; lowercase."}
          action: {type: str, choices: [spam, discard, reject], description: "Required unless state is absent. spam delivers to Junk, discard accepts and drops, reject refuses after DATA."}
          state: {type: str, default: present, choices: [present, absent], description: "absent deletes the entry."}
      stalwart_recipient_policy_namespace: {type: str, default: rcpt-policy, description: "Namespace of the lookup list that holds the policies."}
      stalwart_webhooks:
        type: list
        elements: dict
        default: []
        description: Webhooks Stalwart posts events to, matched by url.
        options:
          url: {type: str, required: true, description: "Endpoint."}
          state: {type: str, default: present, choices: [present, absent], description: "absent deletes it."}
          enable: {type: bool, default: true, description: "false keeps the webhook but sends nothing."}
          events: {type: list, elements: str, description: "Event names (no wildcards); default stalwart_webhook_default_events."}
          events_policy: {type: str, default: include, choices: [include, exclude], description: "Whether the events list is what is sent or what is left out."}
          level: {type: str, default: warn, choices: [error, warn, info, debug, trace], description: "Minimum level sent."}
          bearer_token: {type: str, description: "Authorization: Bearer token."}
          basic_user: {type: str, description: "User for HTTP basic authentication (with basic_password)."}
          basic_password: {type: str, description: "Password for HTTP basic authentication."}
          signature_key: {type: str, description: "HMAC key that signs the request body."}
          headers: {type: dict, description: "Extra HTTP headers."}
          timeout: {type: int, description: "Request timeout in milliseconds."}
          throttle: {type: int, description: "Minimum milliseconds between requests."}
          discard_after: {type: int, description: "Milliseconds after which an undeliverable event is dropped."}
          lossy: {type: bool, description: "Drop events when there is a backlog."}
          allow_invalid_certs: {type: bool, description: "Accept an invalid TLS certificate of the endpoint."}
      stalwart_webhook_default_events: {type: list, elements: str, default: [dns.record-creation-failed, dns.record-propagation-timeout, acme.error, acme.auth-error, acme.order-invalid, tls.no-certificates-available, telemetry.webhook-error], description: "Events of a webhook that lists none."}
      stalwart_enforce_from_header: {type: bool, default: null, description: "true refuses submitted mail whose From address differs from the envelope sender; false removes that check; null leaves the server alone."}
      stalwart_enforce_from_header_except: {type: list, elements: str, default: [], description: "Accounts (addresses) exempt from the From check."}
      stalwart_recipient_policy_spam_score: {type: float, default: 20, description: "Score of the spam tag, high enough to reach the Junk threshold."}
      stalwart_redirect_root: {type: str, default: "", description: "Where / on the Stalwart host name redirects to; \"\" keeps Stalwart's /account."}
      stalwart_check_zone: {type: bool, default: true, description: "Fail when Stalwart's CNAME records and Caddy's subdomain sites differ."}
      stalwart_check_mail: {type: bool, default: true, description: "After the apply, check that the DNS records Stalwart wants are published and that each MX host has a valid certificate."}
      stalwart_check_mail_fatal: {type: bool, default: false, description: "Fail the run on a problem found by stalwart_check_mail instead of reporting it."}
      stalwart_check_mail_only: {type: bool, default: false, description: "Run only the mail check (DNS, TLS, optional test mails) and end the role before anything is applied."}
      stalwart_check_mail_resolver: {type: str, default: 1.1.1.1, description: "Resolver for the DNS part of stalwart_check_mail; empty uses the controller's own."}
      stalwart_check_mail_skip_types: {type: list, elements: str, default: [TLSA], description: "Record types in Stalwart's zone file that stalwart_check_mail does not look for."}
      stalwart_check_mail_send: {type: bool, default: false, description: "Also send a test mail from every domain to a throwaway mail.tm mailbox and check signature, key and delivery."}
      stalwart_check_mail_send_wait: {type: int, default: 120, description: "Seconds stalwart_check_mail_send waits for the test mails to arrive."}
      stalwart_check_mail_send_packages: {type: list, elements: str, default: [python3-dkim, python3-spf, python3-nacl, python3-dnspython], description: "Packages the test mail probe needs; only named in the warning when they are missing."}
      stalwart_permissive_cors: {type: bool, default: false, description: "Stalwart's own allow-every-origin switch."}
      stalwart_absent_dns_providers: {type: list, elements: str, default: [], description: "DNS providers (dns_key_map names) that are no longer wanted."}
      stalwart_relay_hosts:
        type: list
        elements: dict
        default: []
        description: Outbound relays (smarthosts).
        options:
          name: {type: str, required: true, description: "Referenced by route in sender_domain_routing."}
          address: {type: str, required: true, description: "Host name or IP of the relay."}
          port: {type: int, default: 25, description: "Port."}
          protocol: {type: str, default: smtp, description: "Protocol."}
          implicit_tls: {type: bool, default: false, description: "TLS from the first byte (port 465)."}
          allow_invalid_certs: {type: bool, default: false, description: "Accept a self-signed certificate."}
          auth_username: {type: str, description: "Login; needs auth_secret too."}
          auth_secret: {type: str, no_log: true, description: "Password; keep it in a vault."}
          manages_spf: {type: bool, default: false, description: "The relay sends with its own return-path domain (SMTP2GO), so the SPF/dns check is skipped."}
          description: {type: str, description: "Free text."}
          state: {type: str, default: present, choices: [present, absent], description: "absent destroys the relay."}
      sender_domain_routing:
        type: list
        elements: dict
        default: []
        description: Which sender (an address, or @domain for a whole domain) goes through which relay; addresses win over domains.
        options:
          sender: {type: str, required: true, description: "Envelope sender: user@example.org for one address, @example.org for every address of a domain."}
          route: {type: str, required: true, description: "name of an entry of stalwart_relay_hosts."}
          state: {type: str, default: present, choices: [present, absent], description: "absent drops the rule."}
      stalwart_applications:
        type: list
        elements: dict
        default: []
        description: Web applications Stalwart downloads and serves under URL prefixes.
        options:
          description: {type: str, required: true, description: "Identifies the application."}
          url_prefix: {type: list, elements: str, description: "Single path segments such as [/app]."}
          resource_url: {type: str, description: "URL of the zip bundle."}
          enable: {type: bool, default: true, description: "Enabled."}
          auto_update_interval: {type: int, description: "Update interval in milliseconds."}
          state: {type: str, default: present, choices: [present, absent], description: "absent destroys it."}
      dns_key_map: {type: dict, default: {}, description: "Credentials per DNS provider: {hetzner: {api_token: ...}}."}
      stalwart_certs_dir: {type: path, default: /etc/stalwart/certs, description: "Where caddy_front writes the certificates."}
      stalwart_config_dir: {type: path, default: /etc/stalwart, description: "Configuration directory."}
      stalwart_bin_dir: {type: path, default: /usr/local/bin, description: "Binary directory."}
      stalwart_service_name: {type: str, default: stalwart, description: "systemd unit."}
      stalwart_admin_user: {type: str, default: admin, description: "Fallback administrator."}
      stalwart_admin_password: {type: str, no_log: true, description: "Fallback administrator's password."}
      stalwart_mgmt_url: {type: str, description: "URL of the management listener."}
      stalwart_mgmt_bind: {type: str, default: "127.0.0.1:8081", description: "Loopback address of the plain management listener."}
      stalwart_recovery_port: {type: int, default: 8080, description: "Port of the temporary recovery instance."}
      stalwart_recovery_unit: {type: str, default: stalwart-recovery, description: "Unit of the recovery instance."}
      stalwart_force_apply: {type: bool, default: false, description: "Apply the plan even when unchanged."}
      stalwart_http_proxy_bind: {type: str, default: "127.0.0.1:8008", description: "Loopback listener Caddy talks to with PROXY protocol v2."}
      stalwart_proxy_trusted_networks: {type: list, elements: str, description: "Networks trusted on the http-proxy listener."}
      stalwart_global_proxy_trusted_networks: {type: list, elements: str, default: [], description: "SystemSettings.proxyTrustedNetworks; applies to every listener, so it stays empty."}
      stalwart_server_listeners: {type: list, elements: dict, description: "Public listeners: {name, protocol, bind: [...], options: {...}}."}
      stalwart_required_listeners: {type: list, elements: dict, description: "Listeners the roles depend on (http-proxy, mgmt); same shape."}
      stalwart_additional_plan: {type: list, default: [], description: "Operations appended verbatim to the generated plan."}
      stalwart_dns_provider_map: {type: dict, description: "Provider key to Stalwart DnsServer type."}
      stalwart_dns_field_meta: {type: dict, description: "Credential name to Stalwart field mapping per provider."}
