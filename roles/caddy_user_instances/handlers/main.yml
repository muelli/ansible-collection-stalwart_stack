---
- name: Restart the fronting Caddy for new group memberships
  ansible.builtin.systemd_service:
    name: caddy
    state: restarted
  register: caddy_group_restart
  # A teardown removes Caddy before this handler runs.
  failed_when:
    - caddy_group_restart.failed | default(false)
    - "'Could not find the requested service' not in (caddy_group_restart.msg | default(''))"
