---
# One account. The steps are in separate files:
#   account.yml  look up the account, group membership, lingering
#   config.yml   the bare Caddyfile and conf.d/<site>.conf
#   units.yml    systemd user units, start, reload
#   smoke.yml    request a page through the front socket (caddy_user_smoke_test)
- name: "Resolve the instance settings ({{ _caddy_user }})"
  ansible.builtin.set_fact:
    _caddy_user: "{{ caddy_user_item.name | default(caddy_user_item) }}"
    # What the root Caddy forwards to this account (caddy_front reads the same list).
    _caddy_user_hosts: "{{ caddy_user_item.hosts | default([]) }}"
    # Every site gets a name (the file conf.d/<name>.conf), a state and, unless it
    # lists its own, all the hosts of the instance.
    _caddy_user_sites: >-
      {%- set r = [] -%}
      {%- for s in caddy_user_item.sites | default([]) -%}
      {%- set n = s.name | default(((s.hosts | default(caddy_user_item.hosts | default(['site']))) | first) | regex_replace('[^A-Za-z0-9._-]', '_')) -%}
      {%- set _ = r.append(s | combine({'name': n, 'state': s.state | default('present'), 'hosts': s.hosts | default(caddy_user_item.hosts | default([]))})) -%}
      {%- endfor -%}
      {{ r }}

- name: "Check the sites of the instance ({{ _caddy_user }})"
  ansible.builtin.assert:
    that:
      - _caddy_user_sites | map(attribute='name') | list | length == _caddy_user_sites | map(attribute='name') | list | unique | length
      - _caddy_user_sites | selectattr('state', 'equalto', 'present') | selectattr('hosts', 'equalto', []) | list | length == 0
    fail_msg: >-
      The sites of {{ _caddy_user }} need distinct names (the file conf.d/<name>.conf) and
      hosts: their own, or `hosts:` on the instance.

- name: "Look up and prepare the account ({{ _caddy_user }})"
  ansible.builtin.include_tasks: account.yml

- name: "Write the configuration ({{ _caddy_user }})"
  ansible.builtin.include_tasks: config.yml

- name: "Install and start the units ({{ _caddy_user }})"
  ansible.builtin.include_tasks: units.yml

- name: "Check that the instance answers ({{ _caddy_user }})"
  ansible.builtin.include_tasks: smoke.yml
  when: caddy_user_smoke_test | bool
