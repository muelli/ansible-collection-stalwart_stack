---
- name: "Write the user units of {{ _caddy_user }}"
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ _caddy_home }}/.config/systemd/user/{{ item }}"
    owner: "{{ _caddy_user }}"
    group: "{{ _caddy_user }}"
    mode: "0644"
  loop:
    - caddy-user.socket
    - caddy-user-proxy.service
    - caddy-user.service
  register: caddy_user_units

- name: "Wait for the user manager of {{ _caddy_user }}"
  ansible.builtin.wait_for:
    path: "/run/user/{{ _caddy_uid }}/bus"
    timeout: 30

- name: "Clear a failed state of the front socket of {{ _caddy_user }}"
  ansible.builtin.command:
    argv: [systemctl, --user, reset-failed, caddy-user.socket, caddy-user-proxy.service, caddy-user.service]
  become: true
  become_user: "{{ _caddy_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ _caddy_uid }}"
  changed_when: false
  failed_when: false   # units not loaded yet on a first run

# A socket cannot be started or restarted while the service it triggers is running ("Socket
# service ... already active, refusing"). That happens after units changed and when a
# restart failed halfway: the socket is then dead while the proxy lingers, and every later
# run fails the same way. Stopping the idle proxy also stops Caddy (StopWhenUnneeded); the
# next request starts both.
- name: "Check whether the front socket is listening ({{ _caddy_user }})"
  ansible.builtin.command:
    argv: [systemctl, --user, is-active, --quiet, caddy-user.socket]
  become: true
  become_user: "{{ _caddy_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ _caddy_uid }}"
  register: caddy_user_socket_active
  changed_when: false
  failed_when: false

- name: "Stop the proxy so the socket can be (re)started ({{ _caddy_user }})"
  ansible.builtin.command:
    argv: [systemctl, --user, stop, caddy-user-proxy.service]
  become: true
  become_user: "{{ _caddy_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ _caddy_uid }}"
  changed_when: true
  failed_when: false
  when: caddy_user_units.changed or caddy_user_socket_active.rc != 0

- name: "Enable and start the front socket of {{ _caddy_user }}"
  ansible.builtin.systemd_service:
    name: caddy-user.socket
    scope: user
    state: "{{ 'restarted' if caddy_user_units.changed else 'started' }}"
    enabled: true
    daemon_reload: true
  become: true
  become_user: "{{ _caddy_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ _caddy_uid }}"

- name: "Reload the instance after a configuration change ({{ _caddy_user }})"
  ansible.builtin.command:
    argv: [systemctl, --user, try-reload-or-restart, caddy-user.service]
  become: true
  become_user: "{{ _caddy_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ _caddy_uid }}"
  changed_when: true
  when: _caddy_config_changed | bool
