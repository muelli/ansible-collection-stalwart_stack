---
- name: Look up the account
  ansible.builtin.getent:
    database: passwd
    key: "{{ caddy_user_item.name }}"
  failed_when: false

- name: Remove the instance of an existing account
  when: (getent_passwd | default({}))[caddy_user_item.name] | default(none) is not none
  block:
    - name: Remember the account details
      ansible.builtin.set_fact:
        _caddy_user: "{{ caddy_user_item.name }}"
        _caddy_uid: "{{ getent_passwd[caddy_user_item.name][1] }}"
        _caddy_home: "{{ getent_passwd[caddy_user_item.name][4] }}"

    - name: Check whether the user manager is running
      ansible.builtin.stat:
        path: "/run/user/{{ _caddy_uid }}/bus"
      register: caddy_user_bus

    - name: Stop and disable the user units
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        scope: user
        state: stopped
        enabled: false
      loop: [caddy-user.socket, caddy-user-proxy.service, caddy-user.service]
      become: true
      become_user: "{{ _caddy_user }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ _caddy_uid }}"
      when: caddy_user_bus.stat.exists
      failed_when: false

    - name: Remove the user units
      ansible.builtin.file:
        path: "{{ _caddy_home }}/.config/systemd/user/{{ item }}"
        state: absent
      loop: [caddy-user.socket, caddy-user-proxy.service, caddy-user.service]

    - name: Remove the Caddy configuration of the account
      ansible.builtin.file:
        path: "{{ _caddy_home }}/.config/caddy"
        state: absent
      when: caddy_user_item.purge | default(false) | bool

    - name: Check whether the fronting Caddy is in the group of the account
      ansible.builtin.command:
        argv: [id, -nG, "{{ caddy_front_user }}"]
      register: caddy_front_groups
      changed_when: false
      failed_when: false

    - name: Take the fronting Caddy out of the group of the account
      ansible.builtin.command:
        argv: [gpasswd, -d, "{{ caddy_front_user }}", "{{ _caddy_user }}"]
      when: _caddy_user in (caddy_front_groups.stdout | default('')).split()
      changed_when: true
      notify: Restart the fronting Caddy for new group memberships

    - name: Switch lingering off again
      ansible.builtin.command:
        argv: [loginctl, disable-linger, "{{ _caddy_user }}"]
        removes: "/var/lib/systemd/linger/{{ _caddy_user }}"
      when: caddy_user_item.release_linger | default(false) | bool

- name: Remove the socket of the account
  ansible.builtin.file:
    path: "{{ caddy_user_socket_dir }}/{{ caddy_user_item.name }}.sock"
    state: absent
