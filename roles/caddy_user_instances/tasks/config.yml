---
- name: "Create the configuration directories of the account ({{ _caddy_user }})"
  ansible.builtin.file:
    path: "{{ _caddy_home }}/{{ item }}"
    state: directory
    owner: "{{ _caddy_user }}"
    group: "{{ _caddy_user }}"
    mode: "0750"
  loop:
    - .config
    - .config/caddy
    - .config/caddy/conf.d
    - .config/systemd
    - .config/systemd/user

- name: "Write the bare Caddyfile ({{ _caddy_user }})"
  ansible.builtin.template:
    src: Caddyfile-user.j2
    dest: "{{ _caddy_home }}/.config/caddy/Caddyfile"
    owner: "{{ _caddy_user }}"
    group: "{{ _caddy_user }}"
    mode: "0644"
  register: caddy_user_base

# Files in conf.d that are not listed here are never touched: they are the
# account's own.
- name: "Write conf.d/<name>.conf for every present site ({{ _caddy_user }})"
  ansible.builtin.template:
    src: site.conf.j2
    dest: "{{ _caddy_conf_dir }}/{{ item.name }}.conf"
    owner: "{{ _caddy_user }}"
    group: "{{ _caddy_user }}"
    mode: "0644"
  loop: "{{ _caddy_user_sites | selectattr('state', 'equalto', 'present') | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: caddy_user_site_files

- name: "Remove conf.d/<name>.conf of the sites marked absent ({{ _caddy_user }})"
  ansible.builtin.file:
    path: "{{ _caddy_conf_dir }}/{{ item.name }}.conf"
    state: absent
  loop: "{{ _caddy_user_sites | selectattr('state', 'equalto', 'absent') | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: caddy_user_site_removed

- name: "Remember whether the configuration changed ({{ _caddy_user }})"
  ansible.builtin.set_fact:
    _caddy_config_changed: >-
      {{ caddy_user_base.changed
         or (caddy_user_site_files.results | default([]) | selectattr('changed') | list | length > 0)
         or (caddy_user_site_removed.results | default([]) | selectattr('changed') | list | length > 0) }}
