---
# Users that get their own Caddy. Each entry is a name or a dict:
#   - name: alice
#     sites:                       # optional; default is a single hello page
#       - hosts: [alice.example.org, www.alice.example.org]
#         directive: |
#           root * /home/alice/www
#           file_server
#     caddyfile: files/alice.Caddyfile   # optional; replaces the generated file
caddy_user_instances: []

# The accounts must exist already (for example created by DebOps).
caddy_user_socket_dir: /run/caddy-user-sockets
caddy_binary_path: /usr/local/bin/caddy
# Account of the fronting Caddy; it joins each instance's primary group so it
# can connect to the 0660 socket.
caddy_front_user: caddy
# The per-user Caddy stops after this long without traffic.
caddy_user_idle_time: 30m
# Request a page through the socket after deploying.
caddy_user_smoke_test: true
