---
# Users that get their own Caddy. Each instance is bare minimum: a Caddyfile
# with the global options that imports ~/.config/caddy/conf.d/*.conf, nothing
# else. What is served is up to the account: add files to conf.d yourself, they
# are never touched. Each entry is a dict:
#   - name: alice                  # the account; it must exist already
#     state: present               # default; absent removes the units, see below
#     sites:                       # optional: conf.d files this role writes
#       - name: www                # file conf.d/www.conf; default: the first host
#         state: present           # default; absent removes conf.d/www.conf
#         hosts: [alice.example.org, www.alice.example.org]
#                                  # the names caddy_front forwards to this account
#         directive: |             # the body of the site block, as in a Caddyfile
#           root * /home/alice/www
#           file_server
# A site without `directive` is a site block with no content. Sites of an
# account that are written by hand in conf.d need their hosts in caddy_domains
# (`user: alice`) so that the fronting Caddy forwards them.
caddy_user_instances: []

# Default for entries without their own `state`; teardown.yml sets it to absent.
caddy_user_instances_state: present

# The accounts must exist already (for example created by DebOps).
caddy_user_socket_dir: /run/caddy-user-sockets
caddy_binary_path: /usr/local/bin/caddy

# Account of the fronting Caddy; it joins each instance's primary group so it
# can connect to the 0660 socket.
caddy_front_user: caddy

# The per-user Caddy stops after this long without traffic.
caddy_user_idle_time: 30m

# Request a page through the socket after deploying.
caddy_user_smoke_test: true

# --- Removal ----------------------------------------------------------------
# An entry with `state: absent` stops and removes the units of that account and
# takes the fronting Caddy out of its group. `purge: true` also deletes the
# generated or copied Caddyfile and ~/.config/caddy. Lingering was switched on
# for the account; it is only switched off again with `release_linger: true`.
#   - { name: alice, state: absent, purge: true, release_linger: true }
