---
# Bulwark webmail (full edition) as a podman container managed by a Quadlet
# unit, so systemd runs it like any other service. Caddy (caddy_front) fronts
# it: add a site with `caddy_directive: reverse_proxy 127.0.0.1:3000`.

# Needs Stalwart 1.0 with Bulwark >= 1.18.0.
bulwark_version: "1.18.0"
bulwark_image: ghcr.io/bulwarkmail/webmail
# Optional: pin the image by digest as well (sha256:...), checked by podman.
bulwark_image_digest: ""
bulwark_image_ref: "{{ bulwark_image }}{{ '@' ~ bulwark_image_digest if bulwark_image_digest else ':' ~ bulwark_version }}"

# Where Bulwark reaches the JMAP server. The loopback management listener of
# stalwart_config needs no PROXY protocol and no certificate.
bulwark_jmap_url: "http://127.0.0.1:8081"

# The container uses the host network and listens only here.
bulwark_bind: "127.0.0.1"
bulwark_port: 3000

# Initial admin dashboard password (>= 12 characters). Only read on first start.
# bulwark_admin_password: "{{ vault_bulwark_admin_password }}"
# Optional; generated by Bulwark and kept in the state directory when unset.
# bulwark_session_secret: "..."

bulwark_settings_sync: false
bulwark_telemetry: "off"
# More environment variables, see the Bulwark environment reference.
bulwark_extra_env: {}

bulwark_user: bulwark
bulwark_group: bulwark
bulwark_data_dir: /var/lib/bulwark
bulwark_env_dir: /etc/bulwark
bulwark_service_name: bulwark
bulwark_health_timeout: 120

# --- Removal ----------------------------------------------------------------
# absent stops the container and removes the Quadlet unit, the image, the
# environment file and the account. The data (admin config, settings) stays
# unless bulwark_purge_data. Remove the Caddy site with `state: absent` on its
# caddy_domains entry.
bulwark_state: present
bulwark_purge_data: false
